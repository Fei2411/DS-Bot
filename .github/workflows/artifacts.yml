# Build check artifacts for this branch: the Linux AppImage and the Android APK.
# Run from the Actions tab (workflow_dispatch); nothing is published and no secret is
# needed. Without an upload key the APK is signed with the debug key, so installing it
# over a differently signed build needs an uninstall first.
name: Branch artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the link dependencies
        run: npm ci --no-fund --no-audit
        working-directory: link
      - name: Build the plugin bundles
        run: |
          npm ci --no-fund --no-audit
          npm run build
        working-directory: ds-bot
      - name: Install the app dependencies
        run: npm ci --no-fund --no-audit
        working-directory: app
      - name: Seed the Electron checksums
        run: node scripts/seed-electron-checksums.mjs
        working-directory: app
      - name: Pack the AppImage
        run: npm run dist
        working-directory: app
      - name: Keep the AppImage
        # The AppImage is already a compressed squashfs image and the deb is the same
        # app packed a second time, so the deb stays out: one file, half the download.
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-linux-x64
          path: app/dist-pack/DS-Bot-*-linux-x86_64.AppImage
          retention-days: 7
          if-no-files-found: error
          compression-level: 9

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the link dependencies
        run: npm ci --no-fund --no-audit
        working-directory: link
      - name: Install the phone app dependencies
        run: npm ci --no-fund --no-audit
        working-directory: mobile
      - name: Typecheck the phone app
        run: npm run typecheck
        working-directory: mobile
      - name: Test the phone app
        run: npm test
        working-directory: mobile
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Build the APK
        run: |
          (cd android && ./gradlew assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a)
          version="$(node -p "require('../ds-bot/package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/DS-Bot-$version-android.apk"
        working-directory: mobile
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-android
          path: mobile/dist/DS-Bot-*-android.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 9
