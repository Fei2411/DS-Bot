name: Release

# Publishes ds-bot to npm when a GitHub release is published, then attaches the desktop app's
# Windows installer, macOS zips and Linux packages, and (when mobile changed) the phone app's
# Android APK to the release. Windows and the Linux AppImage update from latest.yml /
# latest-linux.yml; macOS self-updates from its zip and SHA256SUMS.txt (falling back to the
# release page when read-only or translocated); the Linux deb opens the release page for a
# manual download.
#
# npm Trusted Publishing: npm trusts this workflow through GitHub's OIDC token, so the
# repository keeps no npm token, and every version gets a provenance statement. It is set
# up once on npmjs.com: package ds-bot → Settings → Trusted Publisher → GitHub Actions,
# user Fei2411, repository DS-Bot, workflow release.yml, no environment.
#
# The release tag must be v<version in ds-bot/package.json> and must point at a commit on
# main. A version with a pre-release part (0.2.0-rc.1) goes to the npm tag "next", so that
# "latest" stays on the last stable version.
#
# Publish the release with "Set as latest release" turned off: the downloads job marks it Latest
# once npm publish, Windows, macOS arm64, Linux, and (when needed) Android succeed (~8-10 min).
# The Intel macOS (x64) build runs in parallel without blocking Latest, then asynchronously
# attaches DS-Bot-*-mac-x64.zip and idempotently refreshes the download table and SHA256SUMS.txt.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and pack the package, but do not publish
        type: boolean
        default: true
      force_android:
        description: Force rebuilding the Android APK even if mobile files did not change
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Fast pre-flight gate (~5-10 s) so invalid tags, mismatched versions, or unfinished release
  # Milestones fail immediately, and decides whether Android APK needs rebuilding.
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      build_android: ${{ steps.android-scope.outputs.build_android }}
      android_fallback_version: ${{ steps.android-scope.outputs.android_fallback_version }}
      android_fallback_size: ${{ steps.android-scope.outputs.android_fallback_size }}
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the tag and the branch
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag is $TAG, but ds-bot/package.json has version $version. Tag v$version or change the version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main. Release from main."
            exit 1
          fi
      - name: Check the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          app="$(node -p "require('../app/package.json').version")"
          if [ "$app" != "$version" ]; then
            echo "::error::app/package.json has version $app, but ds-bot/package.json has $version. Give both the same version."
            exit 1
          fi
      - name: Check release Milestone
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' --exclude='*-*' HEAD^ 2>/dev/null || true)"
          head_msg="$(git log -n 2 --format=%B HEAD 2>/dev/null || true)"
          args=(--version "v$version" --repo "$GITHUB_REPOSITORY" --head-ref HEAD)
          if [ -n "$prev_tag" ]; then
            args+=(--base-ref "$prev_tag")
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            args+=(--allow-open)
          elif grep -Fq '<!-- hotfix -->' <<< "$RELEASE_BODY" \
            || grep -qE '(^Hotfix-Release:\s*true$|Merge pull request #[0-9]+ from [^/]+/(hotfix/|fix/hot-))' <<< "$head_msg"; then
            args+=(--hotfix)
          fi
          node ../scripts/check-release-milestone.mjs "${args[@]}"
      - name: Decide Android APK build scope
        id: android-scope
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ANDROID: ${{ inputs.force_android }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          build_android=true
          fallback_version=""
          fallback_size=""

          if [ "$FORCE_ANDROID" != "true" ]; then
            current_ver="$(node -p "require('./package.json').version")"
            current_tag="${EVENT_TAG:-v$current_ver}"

            # Inspect recent stable published releases carrying a signed Android APK + SHA256SUMS.txt
            # and pick the latest one that is a strict ancestor of HEAD^ (never matching current_tag).
            fallback_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" 2>/dev/null || echo '[]')"
            candidates="$(node -e '
              const releases = JSON.parse(process.argv[1] || "[]");
              const currentTag = process.argv[2] || "";
              for (const rel of releases) {
                if (!rel || rel.draft || rel.prerelease) continue;
                const tag = String(rel.tag_name || "");
                if (!tag || tag === currentTag || !/^v\d+\.\d+\.\d+$/u.test(tag)) continue;
                const ver = tag.slice(1);
                const assets = Array.isArray(rel.assets) ? rel.assets : [];
                const apk = assets.find(a => a?.name === `DS-Bot-${ver}-android.apk` && Number(a.size) > 0);
                const sums = assets.find(a => a?.name === "SHA256SUMS.txt");
                if (apk && sums) {
                  console.log(`${tag}\t${ver}\t${apk.size}`);
                }
              }
            ' "$fallback_json" "$current_tag" || true)"

            while IFS=$'\t' read -r apk_tag apk_ver apk_size; do
              [ -z "$apk_tag" ] && continue
              if ! git rev-parse --verify "refs/tags/$apk_tag^{commit}" >/dev/null 2>&1; then
                continue
              fi
              if ! git merge-base --is-ancestor "refs/tags/$apk_tag^{commit}" HEAD^ 2>/dev/null; then
                continue
              fi
              # Exclude generated release-notes metadata that changes on every release bump so
              # desktop-only releases can reuse the previous signed Android APK.
              changed="$(git -c core.quotepath=false diff --name-only "$apk_tag..HEAD" | grep -Ev '^ds-bot/src/shared/release-notes(-generated\.js|\.json)$' || true)"
              if ! grep -qE '^(mobile/|link/|\.github/gradle/|ds-bot/src/shared/|ds-bot/src/client/(i18n|themes|sources|inks|characters|usage-data|lru|learning-card-model|mark-states|motion-rest|inbox-text|effects)\.js$|ds-bot/src/client/(avatar|locales)/)' <<< "$changed"; then
                build_android=false
                fallback_version="$apk_ver"
                fallback_size="$apk_size"
                echo "No mobile changes since ancestor $apk_tag (signed APK present); skipping Android rebuild."
              fi
              break
            done <<< "$candidates"
          fi

          {
            echo "build_android=$build_android"
            echo "android_fallback_version=$fallback_version"
            echo "android_fallback_size=$fallback_size"
          } | tee -a "$GITHUB_OUTPUT"

  publish:
    name: Check and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2 --no-fund --no-audit

      # The tests rebuild link.js from ../link and run its Relay Server, which have their own packages.
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - name: Restore DSH test harness
        id: harness-cache
        uses: actions/cache/restore@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('ds-bot/dev/harness/package.json', 'ds-bot/dev/harness/package-lock.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - name: Save DSH test harness
        if: github.event_name != 'release' && steps.harness-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}
      - run: npm test
      - run: npm run lint

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release' || (!inputs.dry_run && github.ref == 'refs/heads/main')
        run: |
          tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          echo "Publishing $(node -p "require('./package.json').version") with the npm tag $tag"
          npm publish --provenance --access public --tag "$tag"

      # The release keeps the package file for installs without npm.
      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm pack
          gh release upload "$TAG" "ds-bot-$(node -p "require('./package.json').version").tgz" --clobber

  app-windows:
    name: Desktop app installer (Windows)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Name the download cache
        id: downloads-key
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          BUILDER_HASH: ${{ hashFiles('app/electron-builder.yml') }}
        run: |
          prefix="electron-downloads-${RUNNER_OS}-${RUNNER_ARCH}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${BUILDER_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.downloads-key.outputs.key }}
          restore-keys: ${{ steps.downloads-key.outputs.prefix }}
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/seed-electron-checksums.mjs
      - name: Restore the locked runtime archives
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
      - name: Save the locked runtime archives
        if: github.event_name != 'release' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/build/runtime-cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Save Electron and the build tools
        if: github.event_name != 'release' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      # Upload as a workflow artifact so nothing lands on the public GitHub Release until
      # publish and every primary platform build have succeeded (downloads attaches them at once).
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-win-x64
          path: |
            app/dist-pack/DS-Bot-*-win-x64.exe
            app/dist-pack/DS-Bot-*-win-x64.exe.blockmap
            app/dist-pack/latest.yml
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  app-macos-arm64:
    name: Desktop app zip (macOS arm64)
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Name the download cache
        id: downloads-key
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          BUILDER_HASH: ${{ hashFiles('app/electron-builder.yml') }}
        run: |
          prefix="electron-downloads-${RUNNER_OS}-${RUNNER_ARCH}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${BUILDER_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ steps.downloads-key.outputs.key }}
          restore-keys: ${{ steps.downloads-key.outputs.prefix }}
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/seed-electron-checksums.mjs
      - name: Restore the locked runtime archives
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
        env:
          # Standard Deflate level 5 cuts macOS zip time substantially with ~1% size difference.
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
      - name: Save the locked runtime archives
        if: github.event_name != 'release' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/build/runtime-cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Save Electron and the build tools
        if: github.event_name != 'release' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check packaged binary architecture
        run: |
          exe="dist-pack/mac-arm64/DS Bot.app/Contents/MacOS/DS Bot"
          file -b "$exe" | grep -F "arm64"
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-mac-arm64
          path: app/dist-pack/DS-Bot-*-mac-arm64.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  # Decoupled from downloads so Intel runner queues never block marking the release Latest.
  # Once both downloads and app-macos-x64 finish, downloads-macos-x64 attaches the zip and
  # idempotently refreshes the download table and SHA256SUMS.txt.
  app-macos-x64:
    name: Desktop app zip (macOS x64)
    needs: validate
    runs-on: macos-26-intel
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Name the download cache
        id: downloads-key
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          BUILDER_HASH: ${{ hashFiles('app/electron-builder.yml') }}
        run: |
          prefix="electron-downloads-${RUNNER_OS}-${RUNNER_ARCH}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${BUILDER_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ steps.downloads-key.outputs.key }}
          restore-keys: ${{ steps.downloads-key.outputs.prefix }}
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/seed-electron-checksums.mjs
      - name: Restore the locked runtime archives
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
      - name: Save the locked runtime archives
        if: github.event_name != 'release' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/build/runtime-cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Save Electron and the build tools
        if: github.event_name != 'release' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check packaged binary architecture
        run: |
          exe="dist-pack/mac/DS Bot.app/Contents/MacOS/DS Bot"
          file -b "$exe" | grep -F "x86_64"
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-mac-x64
          path: app/dist-pack/DS-Bot-*-mac-x64.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  app-linux:
    name: Desktop app packages (Linux x64)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Name the download cache
        id: downloads-key
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          BUILDER_HASH: ${{ hashFiles('app/electron-builder.yml') }}
        run: |
          prefix="electron-downloads-${RUNNER_OS}-${RUNNER_ARCH}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}${BUILDER_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ steps.downloads-key.outputs.key }}
          restore-keys: ${{ steps.downloads-key.outputs.prefix }}
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node scripts/seed-electron-checksums.mjs
      - name: Restore the locked runtime archives
        id: runtime-cache
        uses: actions/cache/restore@v4
        with:
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
      - name: Save the locked runtime archives
        if: github.event_name != 'release' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/build/runtime-cache
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Save Electron and the build tools
        if: github.event_name != 'release' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check the packaged app
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces that Chromium's
        # sandbox needs; the release runner may lift that restriction (it is its own machine).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/check-packed.mjs
      - name: Check the files for the release
        # Verify every Linux release asset exists before uploading the artifact.
        run: |
          version="$(node -p "require('./package.json').version")"
          ls -l "dist-pack/DS-Bot-$version-linux-x86_64.AppImage" "dist-pack/DS-Bot-$version-linux-amd64.deb" dist-pack/latest-linux.yml
      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-linux-x64
          path: |
            app/dist-pack/DS-Bot-*-linux-x86_64.AppImage
            app/dist-pack/DS-Bot-*-linux-amd64.deb
            app/dist-pack/latest-linux.yml
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  # The phone app's APK, signed with the upload key in the ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets. Every later APK must carry
  # the same key, or Android refuses it as an update. A dry run without the secrets
  # signs with the debug key, and that APK is for checks only.
  app-android:
    name: Phone app (Android)
    needs: validate
    if: needs.validate.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            link/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          fi
          echo "CCACHE_BIN=$(command -v ccache)" >> "$GITHUB_ENV"
      - name: Restore Android C++ ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: android-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/plugins/**', '.github/gradle/ccache.init.gradle') }}
          restore-keys: android-ccache-v2-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'release' }}
      - name: Build the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
          CCACHE_MAXSIZE: 600M
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          mkdir -p "$CCACHE_DIR"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export DSBOT_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks" DSBOT_ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" DSBOT_ANDROID_KEY_ALIAS="$KEY_ALIAS"
          elif [ "$GITHUB_EVENT_NAME" = release ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing, so the APK cannot be signed for release."
            exit 1
          else
            echo "::warning::No upload key: this dry run signs the APK with the debug key."
          fi
          (cd android && ./gradlew assembleRelease --no-daemon --build-cache --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --init-script "$GITHUB_WORKSPACE/.github/gradle/ccache.init.gradle")
          ccache -s || true
          rm -f "$RUNNER_TEMP/upload.jks"
          version="$(node -p "require('../ds-bot/package.json').version")"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/DS-Bot-$version-android.apk"
      - name: Save Android C++ ccache
        if: github.event_name != 'release' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Check the signature
        run: |
          if unzip -l dist/DS-Bot-*-android.apk | grep -Eq 'lib/(x86|x86_64)/'; then
            echo "::error::Release APK contains x86 simulator binaries."
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          zipalign="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          badging="$("$aapt2" dump badging dist/DS-Bot-*-android.apk)"
          compile_sdk="$(printf '%s\n' "$badging" | sed -n "s/.*compileSdkVersion='\([0-9]*\)'.*/\1/p" | head -n1)"
          target_sdk="$(printf '%s\n' "$badging" | sed -n "s/.*targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -n1)"
          if [ -z "$compile_sdk" ] || [ -z "$target_sdk" ] || [ "$compile_sdk" -gt "$target_sdk" ]; then
            echo "::error::Invalid Android SDK levels in APK: compileSdkVersion=$compile_sdk targetSdkVersion=$target_sdk"
            exit 1
          fi
          if ! printf '%s\n' "$badging" | grep -q "android.permission.POST_NOTIFICATIONS"; then
            echo "::error::Release APK does not declare android.permission.POST_NOTIFICATIONS."
            exit 1
          fi
          "$zipalign" -c -P 16 4 dist/DS-Bot-*-android.apk
          certs="$("$apksigner" verify --min-sdk-version 21 --verbose --print-certs dist/DS-Bot-*-android.apk)"
          echo "$certs" | grep -E '(^Verified using v[123] |certificate (DN|SHA-256 digest):)'
          for scheme in 'v1 scheme (JAR signing): true' 'v2 scheme (APK Signature Scheme v2): true' 'v3 scheme (APK Signature Scheme v3): true'; do
            if ! echo "$certs" | grep -Fq "Verified using $scheme"; then
              echo "::error::The APK is missing signature $scheme."
              exit 1
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = release ] && echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-android
          path: mobile/dist/DS-Bot-*-android.apk
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  downloads:
    name: Download table, checksums and Latest
    needs: [validate, publish, app-windows, app-macos-arm64, app-linux, app-android]
    if: >-
      ${{ !cancelled() &&
          needs.validate.result == 'success' &&
          needs.publish.result == 'success' &&
          needs.app-windows.result == 'success' &&
          needs.app-macos-arm64.result == 'success' &&
          needs.app-linux.result == 'success' &&
          (needs.app-android.result == 'success' || (needs.validate.outputs.build_android == 'false' && needs.app-android.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
      BUILD_ANDROID: ${{ needs.validate.outputs.build_android }}
      ANDROID_FALLBACK_VERSION: ${{ needs.validate.outputs.android_fallback_version }}
      ANDROID_FALLBACK_SIZE: ${{ needs.validate.outputs.android_fallback_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download Windows package artifact
        uses: actions/download-artifact@v4
        with:
          name: DS-Bot-win-x64
          path: ${{ runner.temp }}/packages
      - name: Download macOS arm64 package artifact
        uses: actions/download-artifact@v4
        with:
          name: DS-Bot-mac-arm64
          path: ${{ runner.temp }}/packages
      - name: Download Linux package artifact
        uses: actions/download-artifact@v4
        with:
          name: DS-Bot-linux-x64
          path: ${{ runner.temp }}/packages
      - name: Download Android package artifact
        if: needs.validate.outputs.build_android == 'true'
        uses: actions/download-artifact@v4
        with:
          name: DS-Bot-android
          path: ${{ runner.temp }}/packages
      - name: Read current release notes
        if: github.event_name == 'release'
        run: gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
      - name: Write the download table and the checksums
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          args=("$version" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/attach")
          if [ -f "$RUNNER_TEMP/notes.md" ]; then args+=("$RUNNER_TEMP/notes.md"); fi
          args+=(--pending mac-x64.zip --write-manifest "$RUNNER_TEMP/manifest/release-manifest.json")
          if [ "$BUILD_ANDROID" = "false" ] && [ -n "$ANDROID_FALLBACK_VERSION" ]; then
            ext="android.apk=$ANDROID_FALLBACK_VERSION"
            if [ -n "$ANDROID_FALLBACK_SIZE" ]; then ext="${ext}:${ANDROID_FALLBACK_SIZE}"; fi
            args+=(--external-package "$ext")
          fi
          node scripts/release-notes.mjs "${args[@]}" > "$RUNNER_TEMP/body.md"
          ls -l "$RUNNER_TEMP/packages" "$RUNNER_TEMP/attach"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release manifest for async macOS x64 attachment
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/manifest/release-manifest.json
          retention-days: 7
          if-no-files-found: error
      - name: Attach all primary packages, checksums and copies to the release
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/legacy-release-assets.mjs \
            "$RUNNER_TEMP/packages/DS-Bot-$version-mac-arm64.zip" \
            "$RUNNER_TEMP/packages/DS-Bot-$version-linux-amd64.deb"
          node scripts/release-upload.mjs "$TAG" "$RUNNER_TEMP"/packages/* "$RUNNER_TEMP"/attach/*
      - name: Put the download table on top of the notes
        if: github.event_name == 'release'
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
      # GitHub cannot make a pre-release Latest.
      - name: Mark the release as Latest
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: gh release edit "$TAG" --latest

  downloads-macos-x64:
    name: Attach macOS x64 zip and refresh checksums
    needs: [validate, downloads, app-macos-x64]
    if: ${{ !cancelled() && needs.downloads.result == 'success' && needs.app-macos-x64.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/manifest
      - name: Download macOS x64 package artifact
        uses: actions/download-artifact@v4
        with:
          name: DS-Bot-mac-x64
          path: ${{ runner.temp }}/packages
      - name: Read current release notes
        if: github.event_name == 'release'
        run: gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
      - name: Recompute download table and SHA256SUMS.txt idempotently
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          args=("$version" "$RUNNER_TEMP/packages" "$RUNNER_TEMP/attach")
          if [ -f "$RUNNER_TEMP/notes.md" ]; then args+=("$RUNNER_TEMP/notes.md"); fi
          args+=(--merge-manifest "$RUNNER_TEMP/manifest/release-manifest.json")
          node scripts/release-notes.mjs "${args[@]}" > "$RUNNER_TEMP/body.md"
          ls -l "$RUNNER_TEMP/packages" "$RUNNER_TEMP/attach"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach macOS x64 zip, legacy alias and updated SHA256SUMS.txt
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/legacy-release-assets.mjs \
            "$RUNNER_TEMP/packages/DS-Bot-$version-mac-x64.zip"
          node scripts/release-upload.mjs "$TAG" "$RUNNER_TEMP"/packages/* "$RUNNER_TEMP"/attach/*
      - name: Refresh the download table on the release
        if: github.event_name == 'release'
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
