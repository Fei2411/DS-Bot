name: Linux app image and Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the plugin bundles
        working-directory: ds-bot
        run: |
          npm ci --no-fund --no-audit --prefix ../link
          npm ci --no-fund --no-audit
          npm run build
      - run: npm ci --no-fund --no-audit
      - run: node scripts/seed-electron-checksums.mjs
      - run: npm run dist
      - name: Keep the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-linux-x64
          path: app/dist-pack/DS-Bot-*-linux-x86_64.AppImage
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon --console=plain
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
