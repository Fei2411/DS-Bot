name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Daily full cross-platform verification at 19:00 UTC (03:00 +08:00) targeting dev
    # so Windows, Node 22, browser tests and Docker (:dev) stay verified. Caches remain
    # read-only on schedule so dev code never writes into main's release cache scope.
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to test (defaults to workflow branch)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Pull requests and dev pushes cancel superseded runs so rapid merges never pile up.
# Main pushes and the daily dev Nightly run to completion in isolated lanes so Docker
# publishes and cache saves stay ordered and never block each other.
# Heavy desktop packaging and native mobile builds live in package.yml.
concurrency:
  group: >-
    ${{ github.event_name == 'schedule' && 'test-nightly-dev'
        || (github.event_name == 'workflow_dispatch'
            && format('test-dispatch-{0}', github.event.inputs.ref || github.ref)
            || format('test-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.filter.outputs.checkout_ref }}
      full: ${{ steps.filter.outputs.full }}
      hotfix: ${{ steps.filter.outputs.hotfix }}
      release_pr: ${{ steps.filter.outputs.release_pr }}
      ds_bot: ${{ steps.filter.outputs.ds_bot }}
      ds_bot_browser: ${{ steps.filter.outputs.ds_bot_browser }}
      ds_bot_win: ${{ steps.filter.outputs.ds_bot_win }}
      node22: ${{ steps.filter.outputs.node22 }}
      app_unit: ${{ steps.filter.outputs.app_unit }}
      app_unit_win: ${{ steps.filter.outputs.app_unit_win }}
      mobile: ${{ steps.filter.outputs.mobile }}
      link: ${{ steps.filter.outputs.link }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref || '') }}
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HOTFIX: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release/hotfix') }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          full=false
          main_push=false
          hotfix=false
          release_pr=false

          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$PR_HOTFIX" = "true" ]; then
              hotfix=true
            elif [ "$IS_SAME_REPO" = "true" ] && [[ "$HEAD_REF" == hotfix/* || "$HEAD_REF" == fix/hot-* ]]; then
              hotfix=true
            elif [ -n "$PR_NUMBER" ] && [ -n "$GH_TOKEN" ]; then
              if gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name' 2>/dev/null | grep -qx 'release/hotfix'; then
                hotfix=true
              fi
            fi
            if [ "$hotfix" = "false" ]; then
              release_pr=true
            fi
          fi

          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$release_pr" = "true" ]; then
            full=true
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            # Release PRs already pass the full matrix on BASE_REF=main before merge, and daily
            # schedule keeps caches warm. Running only the Linux baseline + Docker publish here
            # prevents push:main from competing for runners with the Release workflow.
            main_push=true
          fi

          changed=""
          if [ "$full" = "false" ] && [ "$main_push" = "false" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              if ! changed="$(git -c core.quotepath=false diff --name-only "origin/$BASE_REF...HEAD")"; then
                full=true
              fi
            elif [ "$EVENT" = "push" ]; then
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                changed="$(git -c core.quotepath=false diff --name-only "$BEFORE" "$SHA")"
              else
                full=true
              fi
            else
              full=true
            fi
          fi

          has() {
            grep -qE "$1" <<< "$changed"
          }

          if [ "$full" = "false" ] && [ "$main_push" = "false" ] && has '^\.github/workflows/test\.yml$'; then
            full=true
          fi

          if [ "$full" = "true" ]; then
            ds_bot=true
            ds_bot_browser=true
            ds_bot_win=true
            node22=true
            app_unit=true
            app_unit_win=true
            mobile=true
            link=true
            docker=true
          elif [ "$main_push" = "true" ]; then
            ds_bot=true
            ds_bot_browser=true
            ds_bot_win=false
            node22=true
            app_unit=true
            app_unit_win=false
            mobile=true
            link=true
            docker=true
          else
            ds_bot=false
            ds_bot_browser=false
            ds_bot_win=false
            node22=false
            app_unit=false
            app_unit_win=false
            mobile=false
            link=false
            docker=false
            if has '^(ds-bot/|link/|start\.ps1$|CHANGELOG\.md$|scripts/(check-pure-base-sync|check-release-milestone)\.mjs$|\.github/workflows/(package|full-package|pr-triage-labels|pr-merge-guard|release|nightly-release|cut-release)\.yml$)'; then ds_bot=true; fi
            if has '^(ds-bot/(src/client/|src/host/browser/|src/host/fonts\.js$|src/shared/|assets/|test/(browser/|harness-resolve\.mjs$)|scripts/|dev/harness/|package\.json$|package-lock\.json$)|app/ui/src/html-preview\.js$)'; then ds_bot_browser=true; fi
            if has '^(app/|ds-bot/|link/|README\.md$|README\.zh\.md$|\.github/workflows/release\.yml$)'; then app_unit=true; fi
            if has '^(mobile/|link/|CHANGELOG\.md$|ds-bot/(package\.json|link\.js)$|ds-bot/src/shared/|ds-bot/src/host/phone\.js$|ds-bot/src/client/(i18n|themes|sources|inks|characters|usage-data|lru|learning-card-model|mark-states|motion-rest|inbox-text|effects)\.js$|ds-bot/src/client/(avatar|locales)/)'; then mobile=true; fi
            if has '^link/'; then link=true; fi
            if has '^(docker/|docker-compose.*\.yml$|\.dockerignore$)'; then docker=true; fi
            # Push to dev stays fast and Linux-only so rapid merges warm Linux caches and catch
            # cross-PR regressions immediately without hogging Windows or Docker runners; Windows,
            # Node 22, and Docker :dev publishing run on the daily dev Nightly.
            if [ "$EVENT" = "push" ]; then
              ds_bot=true
              app_unit=true
              docker=false
            fi
          fi

          checkout_ref=""
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            # Pin every downstream job to the exact commit SHA resolved here so a concurrent
            # merge to dev cannot mix commits across scan, unit tests, and Docker publishing.
            checkout_ref="$(git rev-parse HEAD)"
          fi

          {
            echo "checkout_ref=$checkout_ref"
            echo "full=$full"
            echo "hotfix=$hotfix"
            echo "release_pr=$release_pr"
            echo "ds_bot=$ds_bot"
            echo "ds_bot_browser=$ds_bot_browser"
            echo "ds_bot_win=$ds_bot_win"
            echo "node22=$node22"
            echo "app_unit=$app_unit"
            echo "app_unit_win=$app_unit_win"
            echo "mobile=$mobile"
            echo "link=$link"
            echo "docker=$docker"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: ubuntu-latest · Node 24 (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.ds_bot == 'true'
    runs-on: ubuntu-latest
    # Each shard runs roughly one-third of ds-bot's unit tests in ~1–2 minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '')) && 'npm' || '' }}
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - name: Restore DSH test harness
        id: harness-cache
        uses: actions/cache/restore@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('ds-bot/dev/harness/package.json', 'ds-bot/dev/harness/package-lock.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - name: Save DSH test harness
        if: matrix.shard == 1 && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '')) && steps.harness-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}
      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        run: node --import ./test/harness-resolve.mjs --test --test-shard=${{ matrix.shard }}/3 --test-timeout=120000 --test-force-exit "test/*.test.js"
      - name: Lint
        if: matrix.shard == 1
        run: npm run lint

  test-browser:
    name: Browser tests (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.ds_bot_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '')) && 'npm' || '' }}
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - name: Restore DSH test harness
        id: harness-cache
        uses: actions/cache/restore@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('ds-bot/dev/harness/package.json', 'ds-bot/dev/harness/package-lock.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - name: Save DSH test harness
        if: needs.changes.outputs.ds_bot != 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '')) && steps.harness-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ds-bot/package-lock.json') }}
      - name: Install Chromium for the browser tests
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Save Playwright Chromium
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '')) && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Browser tests
        run: npm run test:browser

  test-windows:
    name: windows-latest · Node 24 (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.ds_bot_win == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '')) && 'npm' || '' }}
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - name: Restore DSH test harness
        id: harness-cache
        uses: actions/cache/restore@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('ds-bot/dev/harness/package.json', 'ds-bot/dev/harness/package-lock.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - name: Save DSH test harness
        if: matrix.shard == 1 && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '')) && steps.harness-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}
      - name: Run unit tests (Windows shard ${{ matrix.shard }}/4)
        env:
          MATRIX_SHARD: ${{ matrix.shard }}
        run: |
          # Split Windows unit tests across 4 balanced parallel shards while keeping
          # --test-concurrency=2 per shard to avoid Windows file-lock contention.
          npm run test:windows:shard -- --shard "${MATRIX_SHARD}/4"

  test-node22:
    name: ubuntu-latest · Node 22
    needs: changes
    if: needs.changes.outputs.node22 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '')) && 'npm' || '' }}
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - name: Restore DSH test harness
        id: harness-cache
        uses: actions/cache/restore@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('ds-bot/dev/harness/package.json', 'ds-bot/dev/harness/package-lock.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - name: Save DSH test harness
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.ref == '')) && steps.harness-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}
      - run: npm test

  release-milestone:
    name: Release milestone gate
    needs: changes
    if: needs.changes.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify target release Milestone has zero blocking open items
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./ds-bot/package.json').version")"
          args=(--version "v$version" --repo "$GITHUB_REPOSITORY" --base-ref origin/main --head-ref HEAD)
          if [ -n "$PR_NUMBER" ]; then
            args+=(--ignore-pr "$PR_NUMBER")
          fi
          # Fork PRs may receive a restricted token; gracefully skip only on 401/403.
          if [ "$IS_FORK" = "true" ]; then
            args+=(--allow-missing-token)
          fi
          node scripts/check-release-milestone.mjs "${args[@]}"

  scan:
    name: Leak scan
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Scan exactly the tracked files, as they would be published.
      - run: mkdir -p "$RUNNER_TEMP/tree" && git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
      - run: node scripts/scan.mjs "$RUNNER_TEMP/tree"
        env:
          SCAN_EXTRA_PATTERNS: ${{ secrets.SCAN_EXTRA_PATTERNS }}

  app:
    name: Desktop app profile
    needs: changes
    if: needs.changes.outputs.app_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '')) && 'npm' || '' }}
          cache-dependency-path: app/package-lock.json
      # The UI build and unit tests start no Electron binary.
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build desktop UI bundle
        run: npm run build
      - run: npm test

  app-windows:
    name: Desktop app unit tests (Windows)
    needs: changes
    if: needs.changes.outputs.app_unit_win == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '')) && 'npm' || '' }}
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  mobile:
    name: Mobile app typecheck
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '')) && 'npm' || '' }}
          cache-dependency-path: |
            mobile/package-lock.json
            link/package-lock.json
      # The app type-checks the shared code in ../link, which has its own packages.
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test

  link:
    name: Phone link and Relay Server
    needs: changes
    if: needs.changes.outputs.link == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: link
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ (github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ref != '')) && 'npm' || '' }}
          cache-dependency-path: link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker startup and data migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test, scan]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && needs.scan.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.changes.outputs.docker == 'true' }}
    outputs:
      image_sha: ${{ steps.build-meta.outputs.sha }}
      image_branch: ${{ steps.build-meta.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - name: Record tested image metadata
        id: build-meta
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          branch=""
          if [ "$EVENT" = "schedule" ]; then
            branch=dev
          elif [ "$EVENT" = "push" ]; then
            branch=main
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker/compose.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ds-bot:test
          labels: org.opencontainers.image.revision=${{ steps.build-meta.outputs.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=docker-prod
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=docker-prod' || '' }}
      - run: node docker/test.mjs ds-bot:test
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: ds-bot:dev-test
          load: true
          push: false
          cache-from: type=gha,scope=docker-dev
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=docker-dev' || '' }}
      - run: node docker/test-dev.mjs ds-bot:dev-test ds-bot:test
      - name: Save the tested image
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && github.repository == 'Fei-Craft/DS-Bot'
        run: docker save --output "$RUNNER_TEMP/ds-bot-image.tar" ds-bot:test
      - name: Upload the tested image
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && github.repository == 'Fei-Craft/DS-Bot'
        uses: actions/upload-artifact@v4
        with:
          name: ds-bot-image
          path: ${{ runner.temp }}/ds-bot-image.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
          overwrite: true

  # The one check that branch rules require. A job whose needs failed is skipped,
  # and GitHub counts a skipped required check as passed, so this job always runs
  # and fails unless every job required for the changed paths passed.
  # Live label/milestone merge gating (needs-product-ok, future Milestone) runs in
  # pr-merge-guard.yml via the independent "PR merge guard" commit status.
  result:
    name: Test result
    needs: [changes, test, test-browser, test-windows, test-node22, release-milestone, scan, app, app-windows, mobile, link, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          RUN_DS_BOT: ${{ needs.changes.outputs.ds_bot }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_DS_BOT_BROWSER: ${{ needs.changes.outputs.ds_bot_browser }}
          TEST_BROWSER_RESULT: ${{ needs.test-browser.result }}
          RUN_DS_BOT_WIN: ${{ needs.changes.outputs.ds_bot_win }}
          TEST_WIN_RESULT: ${{ needs.test-windows.result }}
          RUN_NODE22: ${{ needs.changes.outputs.node22 }}
          NODE22_RESULT: ${{ needs.test-node22.result }}
          RUN_RELEASE_MILESTONE: ${{ needs.changes.outputs.release_pr }}
          RELEASE_MILESTONE_RESULT: ${{ needs.release-milestone.result }}
          RUN_APP_UNIT: ${{ needs.changes.outputs.app_unit }}
          APP_RESULT: ${{ needs.app.result }}
          RUN_APP_UNIT_WIN: ${{ needs.changes.outputs.app_unit_win }}
          APP_WIN_UNIT_RESULT: ${{ needs.app-windows.result }}
          RUN_MOBILE: ${{ needs.changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          RUN_LINK: ${{ needs.changes.outputs.link }}
          LINK_RESULT: ${{ needs.link.result }}
          RUN_DOCKER: ${{ needs.changes.outputs.docker }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" wanted="$2" actual="$3"
            if [ "$wanted" = "true" ]; then
              if [ "$actual" != "success" ]; then
                echo "::error::$name was required for these changes but ended with '$actual'"
                fail=1
              fi
            elif [ "$wanted" = "false" ]; then
              if [ "$actual" != "skipped" ] && [ "$actual" != "success" ]; then
                echo "::error::$name ended with '$actual'"
                fail=1
              fi
            else
              echo "::error::$name had unexpected requirement flag '$wanted' (result '$actual')"
              fail=1
            fi
          }
          check "changes" "true" "$CHANGES_RESULT"
          check "scan" "true" "$SCAN_RESULT"
          check "test" "$RUN_DS_BOT" "$TEST_RESULT"
          check "test-browser" "$RUN_DS_BOT_BROWSER" "$TEST_BROWSER_RESULT"
          check "test-windows" "$RUN_DS_BOT_WIN" "$TEST_WIN_RESULT"
          check "test-node22" "$RUN_NODE22" "$NODE22_RESULT"
          check "release-milestone" "$RUN_RELEASE_MILESTONE" "$RELEASE_MILESTONE_RESULT"
          check "app" "$RUN_APP_UNIT" "$APP_RESULT"
          check "app-windows" "$RUN_APP_UNIT_WIN" "$APP_WIN_UNIT_RESULT"
          check "mobile" "$RUN_MOBILE" "$MOBILE_RESULT"
          check "link" "$RUN_LINK" "$LINK_RESULT"
          check "docker" "$RUN_DOCKER" "$DOCKER_RESULT"
          exit "$fail"

  publish-docker:
    name: Publish Docker image
    needs: [docker, result]
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.result.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && github.repository == 'Fei-Craft/DS-Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v4
        with:
          name: ds-bot-image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/ds-bot-image.tar"
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_BRANCH: ${{ needs.docker.outputs.image_branch }}
          GHCR_SHA: ${{ needs.docker.outputs.image_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GHCR_REPOSITORY,,}"
          case "$GHCR_BRANCH" in
            main) tag=latest ;;
            dev) tag=dev ;;
            *) exit 0 ;;
          esac
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker tag ds-bot:test "$image:sha-$GHCR_SHA"
          docker push "$image:sha-$GHCR_SHA"
          if [ "$GHCR_BRANCH" = "main" ]; then
            branch_sha="$(gh api "repos/$GHCR_REPOSITORY/git/ref/heads/$GHCR_BRANCH" --jq .object.sha)"
            if [ "$GHCR_SHA" != "$branch_sha" ]; then
              echo "Skipping :$tag because $GHCR_BRANCH now points to $branch_sha instead of $GHCR_SHA"
              exit 0
            fi
          else
            # For nightly :dev publishes, dev pushes do not publish replacement images; advance
            # :dev for the latest passing nightly ancestor while preventing older reruns from
            # rolling :dev backwards.
            cmp_dev="$(gh api "repos/$GHCR_REPOSITORY/compare/$GHCR_SHA...dev" --jq .status)"
            if [ "$cmp_dev" != "identical" ] && [ "$cmp_dev" != "ahead" ]; then
              echo "Skipping :$tag because $GHCR_SHA is not an ancestor of dev (compare status: $cmp_dev)"
              exit 0
            fi
            repo_lc="${GHCR_REPOSITORY,,}"
            reg_token="$(curl -fsSL -u "$GHCR_ACTOR:$GH_TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo_lc:pull" | jq -r '.token // empty' || true)"
            current_sha=""
            if [ -n "$reg_token" ]; then
              cfg_digest="$(curl -fsSL \
                -H "Authorization: Bearer $reg_token" \
                -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                "https://ghcr.io/v2/$repo_lc/manifests/$tag" 2>/dev/null | jq -r '.config.digest // empty' || true)"
              if [ -n "$cfg_digest" ]; then
                current_sha="$(curl -fsSL \
                  -H "Authorization: Bearer $reg_token" \
                  "https://ghcr.io/v2/$repo_lc/blobs/$cfg_digest" 2>/dev/null | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' || true)"
              fi
            fi
            if [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]] && [ "$current_sha" != "$GHCR_SHA" ]; then
              cmp_prev="$(gh api "repos/$GHCR_REPOSITORY/compare/$current_sha...$GHCR_SHA" --jq .status 2>/dev/null || echo unknown)"
              if [ "$cmp_prev" != "ahead" ] && [ "$cmp_prev" != "identical" ]; then
                echo "Skipping :$tag because current :$tag ($current_sha) is not behind $GHCR_SHA (compare status: $cmp_prev)"
                exit 0
              fi
            fi
          fi
          docker tag ds-bot:test "$image:$tag"
          docker push "$image:$tag"
