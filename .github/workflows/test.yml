name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Daily full cross-platform verification at 19:00 UTC (03:00 +08:00) on the default branch
    # so Node 22, Docker and caches stay verified and warm without slowing PRs.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks. A run on main or dev finishes, and
# of the pushes that wait for it only the newest runs next: a cancelled run never saves the
# download caches that every pull request restores, and running one at a time keeps the
# Docker image of an earlier commit from being pushed after a later one.
# Heavy desktop packaging and native mobile builds live in package.yml so a flaky unit test
# here can be re-run in minutes instead of waiting for 30-40 minute macOS/Windows installers.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      hotfix: ${{ steps.filter.outputs.hotfix }}
      release_pr: ${{ steps.filter.outputs.release_pr }}
      pr_guard: ${{ steps.filter.outputs.pr_guard }}
      ds_bot: ${{ steps.filter.outputs.ds_bot }}
      node22: ${{ steps.filter.outputs.node22 }}
      app_unit: ${{ steps.filter.outputs.app_unit }}
      app_unit_win: ${{ steps.filter.outputs.app_unit_win }}
      mobile: ${{ steps.filter.outputs.mobile }}
      link: ${{ steps.filter.outputs.link }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HOTFIX: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release/hotfix') }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          full=false
          main_push=false
          hotfix=false
          release_pr=false
          pr_guard=false

          if [ "$EVENT" = "pull_request" ]; then
            pr_guard=true
          fi

          if [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$PR_HOTFIX" = "true" ]; then
              hotfix=true
            elif [ "$IS_SAME_REPO" = "true" ] && [[ "$HEAD_REF" == hotfix/* || "$HEAD_REF" == fix/hot-* ]]; then
              hotfix=true
            elif [ -n "$PR_NUMBER" ] && [ -n "$GH_TOKEN" ]; then
              if gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" --jq '.[].name' 2>/dev/null | grep -qx 'release/hotfix'; then
                hotfix=true
              fi
            fi
            if [ "$hotfix" = "false" ]; then
              release_pr=true
            fi
          fi

          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$release_pr" = "true" ]; then
            full=true
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            # Release PRs already pass the full matrix on BASE_REF=main before merge, and daily
            # schedule keeps main caches warm. Running only the fast baseline + Docker publish here
            # prevents push:main from competing for runners with the Release workflow.
            main_push=true
          fi

          changed=""
          if [ "$full" = "false" ] && [ "$main_push" = "false" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              if ! changed="$(git -c core.quotepath=false diff --name-only "origin/$BASE_REF...HEAD")"; then
                full=true
              fi
            elif [ "$EVENT" = "push" ]; then
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                changed="$(git -c core.quotepath=false diff --name-only "$BEFORE" "$SHA")"
              else
                full=true
              fi
            else
              full=true
            fi
          fi

          has() {
            grep -qE "$1" <<< "$changed"
          }

          if [ "$full" = "false" ] && [ "$main_push" = "false" ] && has '^\.github/workflows/test\.yml$'; then
            full=true
          fi

          if [ "$full" = "true" ]; then
            ds_bot=true
            node22=true
            app_unit=true
            app_unit_win=true
            mobile=true
            link=true
            docker=true
          elif [ "$main_push" = "true" ]; then
            ds_bot=true
            node22=true
            app_unit=true
            app_unit_win=false
            mobile=true
            link=true
            docker=true
          else
            ds_bot=false
            node22=false
            app_unit=false
            app_unit_win=false
            mobile=false
            link=false
            docker=false
            if has '^(ds-bot/|link/|start\.ps1$|CHANGELOG\.md$|scripts/(check-pure-base-sync|check-release-milestone)\.mjs$|\.github/workflows/(package|full-package|pr-triage-labels|pr-merge-guard|release|nightly-release|cut-release)\.yml$)'; then ds_bot=true; fi
            if has '^(app/|ds-bot/|link/|README\.md$|README\.zh\.md$|\.github/workflows/release\.yml$)'; then app_unit=true; fi
            if has '^app/'; then app_unit_win=true; fi
            if has '^(mobile/|link/|CHANGELOG\.md$|ds-bot/(package\.json|link\.js)$|ds-bot/src/shared/|ds-bot/src/host/phone\.js$|ds-bot/src/client/(i18n|themes|sources|inks|characters|usage-data|lru|learning-card-model|mark-states|motion-rest|inbox-text|effects)\.js$|ds-bot/src/client/(avatar|locales)/)'; then mobile=true; fi
            if has '^link/'; then link=true; fi
            if has '^(docker/|docker-compose.*\.yml$|\.dockerignore$|ds-bot/package\.json$|ds-bot/package-lock\.json$|ds-bot/\.npmrc$|ds-bot/cordis\.patch\.yml$|ds-bot/plugin\.js$)'; then docker=true; fi
            # Rapid merges to dev can supersede intermediate queued pushes, so always run the
            # fast Linux/Windows baseline checks and publish :dev on push to dev.
            if [ "$EVENT" = "push" ]; then
              ds_bot=true
              node22=true
              app_unit=true
              docker=true
            fi
          fi

          {
            echo "full=$full"
            echo "hotfix=$hotfix"
            echo "release_pr=$release_pr"
            echo "pr_guard=$pr_guard"
            echo "ds_bot=$ds_bot"
            echo "node22=$node22"
            echo "app_unit=$app_unit"
            echo "app_unit_win=$app_unit_win"
            echo "mobile=$mobile"
            echo "link=$link"
            echo "docker=$docker"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.shard && format('{0} · Node {1} (shard {2}/{3})', matrix.os, matrix.node, matrix.shard, matrix.shard_total) || format('{0} · Node {1}', matrix.os, matrix.node) }}
    needs: changes
    if: needs.changes.outputs.ds_bot == 'true'
    runs-on: ${{ matrix.os }}
    # The suite takes a few minutes; a test that never settles used to hold the job for the
    # runner's six-hour limit.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24, browser: true, lint: true }
          - { os: windows-latest, node: 24, shard: 1, shard_total: 4 }
          - { os: windows-latest, node: 24, shard: 2, shard_total: 4 }
          - { os: windows-latest, node: 24, shard: 3, shard_total: 4 }
          - { os: windows-latest, node: 24, shard: 4, shard_total: 4 }
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - name: Restore DSH test harness
        id: harness-cache
        uses: actions/cache/restore@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ hashFiles('ds-bot/dev/harness/package.json', 'ds-bot/dev/harness/package-lock.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - name: Save DSH test harness
        if: github.event_name != 'pull_request' && steps.harness-cache.outputs.cache-hit != 'true' && (!matrix.shard || matrix.shard == 1)
        uses: actions/cache/save@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}
      - name: Run unit tests
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_SHARD: ${{ matrix.shard }}
          MATRIX_SHARD_TOTAL: ${{ matrix.shard_total }}
        run: |
          if [ -n "$MATRIX_SHARD" ]; then
            # Split Windows unit tests across 4 balanced parallel shards while keeping
            # --test-concurrency=2 per shard to avoid Windows file-lock contention.
            npm run test:windows:shard -- --shard "${MATRIX_SHARD}/${MATRIX_SHARD_TOTAL}"
          elif [ "$MATRIX_OS" = "windows-latest" ]; then
            npm run test:windows
          else
            npm test
          fi
      - name: Lint
        if: matrix.lint
        run: npm run lint
      # The Bot browser and settings layout tests drive a real Chromium; one Linux run is enough.
      - name: Restore Playwright Chromium
        id: playwright-cache
        if: matrix.browser
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ds-bot/package-lock.json') }}
      - name: Install Chromium for the browser tests
        if: matrix.browser
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Save Playwright Chromium
        if: matrix.browser && github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Browser tests
        if: matrix.browser
        run: npm run test:browser

  test-node22:
    name: ubuntu-latest · Node 22
    needs: changes
    if: needs.changes.outputs.node22 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - name: Restore DSH test harness
        id: harness-cache
        uses: actions/cache/restore@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('ds-bot/dev/harness/package.json', 'ds-bot/dev/harness/package-lock.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - name: Save DSH test harness
        if: github.event_name != 'pull_request' && steps.harness-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: ${{ steps.harness-cache.outputs.cache-primary-key }}
      - run: npm test

  release-milestone:
    name: Release milestone gate
    needs: changes
    if: needs.changes.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify target release Milestone has zero blocking open items
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./ds-bot/package.json').version")"
          args=(--version "v$version" --repo "$GITHUB_REPOSITORY" --base-ref origin/main --head-ref HEAD)
          if [ -n "$PR_NUMBER" ]; then
            args+=(--ignore-pr "$PR_NUMBER")
          fi
          # Fork PRs may receive a restricted token; gracefully skip only on 401/403.
          if [ "$IS_FORK" = "true" ]; then
            args+=(--allow-missing-token)
          fi
          node scripts/check-release-milestone.mjs "${args[@]}"

  # Lightweight merge-guard check integrated into Test result so needs-product-ok and future
  # Milestone blocks are enforced immediately even before PR merge guard is added to Rulesets.
  # Live label/milestone updates without re-running unit tests are handled by pr-merge-guard.yml.
  pr-guard:
    name: PR merge guard (in Test)
    needs: changes
    if: needs.changes.outputs.pr_guard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify needs-product-ok and active dev Milestone
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          dev_version="$(git show origin/dev:ds-bot/package.json 2>/dev/null | node -e "const d = JSON.parse(require('node:fs').readFileSync(0,'utf8')); console.log(d.version);" || node -p "require('./ds-bot/package.json').version")"
          args=(--mode pr-guard --pr "$PR_NUMBER" --current-version "$dev_version" --repo "$GITHUB_REPOSITORY")
          if [ "$IS_FORK" = "true" ]; then
            args+=(--allow-missing-token)
          fi
          node scripts/check-release-milestone.mjs "${args[@]}"

  scan:
    name: Leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Scan exactly the tracked files, as they would be published.
      - run: mkdir -p "$RUNNER_TEMP/tree" && git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
      - run: node scripts/scan.mjs "$RUNNER_TEMP/tree"
        env:
          SCAN_EXTRA_PATTERNS: ${{ secrets.SCAN_EXTRA_PATTERNS }}

  app:
    name: Desktop app profile
    needs: changes
    if: needs.changes.outputs.app_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The UI build and unit tests start no Electron binary.
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build desktop UI bundle
        run: npm run build
      - run: npm test

  app-windows:
    name: Desktop app unit tests (Windows)
    needs: changes
    if: needs.changes.outputs.app_unit_win == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  mobile:
    name: Mobile app typecheck
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            link/package-lock.json
      # The app type-checks the shared code in ../link, which has its own packages.
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test

  link:
    name: Phone link and Relay Server
    needs: changes
    if: needs.changes.outputs.link == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: link
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker startup and data migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test, scan]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && needs.scan.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.changes.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker/compose.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ds-bot:test
          load: true
          push: false
          cache-from: type=gha,scope=docker-prod
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=docker-prod' || '' }}
      - run: node docker/test.mjs ds-bot:test
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: ds-bot:dev-test
          load: true
          push: false
          cache-from: type=gha,scope=docker-dev
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=docker-dev' || '' }}
      - run: node docker/test-dev.mjs ds-bot:dev-test ds-bot:test
      - name: Save the tested image
        if: github.event_name == 'push' && github.repository == 'Fei-Craft/DS-Bot'
        run: docker save --output "$RUNNER_TEMP/ds-bot-image.tar" ds-bot:test
      - name: Upload the tested image
        if: github.event_name == 'push' && github.repository == 'Fei-Craft/DS-Bot'
        uses: actions/upload-artifact@v4
        with:
          name: ds-bot-image
          path: ${{ runner.temp }}/ds-bot-image.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
          overwrite: true

  # The one check that branch rules require. A job whose needs failed is skipped,
  # and GitHub counts a skipped required check as passed, so this job always runs
  # and fails unless every job required for the changed paths passed.
  result:
    name: Test result
    needs: [changes, test, test-node22, release-milestone, pr-guard, scan, app, app-windows, mobile, link, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          RUN_DS_BOT: ${{ needs.changes.outputs.ds_bot }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_NODE22: ${{ needs.changes.outputs.node22 }}
          NODE22_RESULT: ${{ needs.test-node22.result }}
          RUN_RELEASE_MILESTONE: ${{ needs.changes.outputs.release_pr }}
          RELEASE_MILESTONE_RESULT: ${{ needs.release-milestone.result }}
          RUN_PR_GUARD: ${{ needs.changes.outputs.pr_guard }}
          PR_GUARD_RESULT: ${{ needs.pr-guard.result }}
          RUN_APP_UNIT: ${{ needs.changes.outputs.app_unit }}
          APP_RESULT: ${{ needs.app.result }}
          RUN_APP_UNIT_WIN: ${{ needs.changes.outputs.app_unit_win }}
          APP_WIN_UNIT_RESULT: ${{ needs.app-windows.result }}
          RUN_MOBILE: ${{ needs.changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          RUN_LINK: ${{ needs.changes.outputs.link }}
          LINK_RESULT: ${{ needs.link.result }}
          RUN_DOCKER: ${{ needs.changes.outputs.docker }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" wanted="$2" actual="$3"
            if [ "$wanted" = "true" ]; then
              if [ "$actual" != "success" ]; then
                echo "::error::$name was required for these changes but ended with '$actual'"
                fail=1
              fi
            elif [ "$wanted" = "false" ]; then
              if [ "$actual" != "skipped" ] && [ "$actual" != "success" ]; then
                echo "::error::$name ended with '$actual'"
                fail=1
              fi
            else
              echo "::error::$name had unexpected requirement flag '$wanted' (result '$actual')"
              fail=1
            fi
          }
          check "changes" "true" "$CHANGES_RESULT"
          check "scan" "true" "$SCAN_RESULT"
          check "test" "$RUN_DS_BOT" "$TEST_RESULT"
          check "test-node22" "$RUN_NODE22" "$NODE22_RESULT"
          check "release-milestone" "$RUN_RELEASE_MILESTONE" "$RELEASE_MILESTONE_RESULT"
          check "pr-guard" "$RUN_PR_GUARD" "$PR_GUARD_RESULT"
          check "app" "$RUN_APP_UNIT" "$APP_RESULT"
          check "app-windows" "$RUN_APP_UNIT_WIN" "$APP_WIN_UNIT_RESULT"
          check "mobile" "$RUN_MOBILE" "$MOBILE_RESULT"
          check "link" "$RUN_LINK" "$LINK_RESULT"
          check "docker" "$RUN_DOCKER" "$DOCKER_RESULT"
          exit "$fail"

  publish-docker:
    name: Publish Docker image
    needs: [docker, result]
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.result.result == 'success' && github.event_name == 'push' && github.repository == 'Fei-Craft/DS-Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v4
        with:
          name: ds-bot-image
          path: ${{ runner.temp }}
      - run: docker load --input "$RUNNER_TEMP/ds-bot-image.tar"
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_BRANCH: ${{ github.ref_name }}
          GHCR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GHCR_REPOSITORY,,}"
          case "$GHCR_BRANCH" in
            main) tag=latest ;;
            dev) tag=dev ;;
            *) exit 0 ;;
          esac
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker tag ds-bot:test "$image:sha-$GHCR_SHA"
          docker push "$image:sha-$GHCR_SHA"
          branch_sha="$(gh api "repos/$GHCR_REPOSITORY/git/ref/heads/$GHCR_BRANCH" --jq .object.sha)"
          if [ "$GHCR_SHA" != "$branch_sha" ]; then
            echo "Skipping :$tag because $GHCR_BRANCH now points to $branch_sha instead of $GHCR_SHA"
            exit 0
          fi
          docker tag ds-bot:test "$image:$tag"
          docker push "$image:$tag"
