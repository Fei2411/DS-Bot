name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Daily full cross-platform verification at 19:00 UTC (03:00 +08:00) on the default branch
    # so heavy packaging, iOS builds, Node 22 and caches stay verified and warm without slowing PRs.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks. A run on main or dev finishes, and
# of the pushes that wait for it only the newest runs next: a cancelled run never saves the
# download caches that every pull request restores, and running one at a time keeps the
# Docker image of an earlier commit from being pushed after a later one.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.filter.outputs.full }}
      ds_bot: ${{ steps.filter.outputs.ds_bot }}
      node22: ${{ steps.filter.outputs.node22 }}
      app_unit: ${{ steps.filter.outputs.app_unit }}
      app_package_full: ${{ steps.filter.outputs.app_package_full }}
      app_package_linux: ${{ steps.filter.outputs.app_package_linux }}
      app_update: ${{ steps.filter.outputs.app_update }}
      mobile: ${{ steps.filter.outputs.mobile }}
      mobile_ios: ${{ steps.filter.outputs.mobile_ios }}
      link: ${{ steps.filter.outputs.link }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          full=false
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ] || [ "$REF" = "refs/heads/main" ] || [ "$BASE_REF" = "main" ]; then
            full=true
          fi

          changed=""
          if [ "$full" = "false" ]; then
            if [ "$EVENT" = "pull_request" ]; then
              if ! changed="$(git -c core.quotepath=false diff --name-only "origin/$BASE_REF...HEAD")"; then
                full=true
              fi
            elif [ "$EVENT" = "push" ]; then
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                changed="$(git -c core.quotepath=false diff --name-only "$BEFORE" "$SHA")"
              else
                full=true
              fi
            else
              full=true
            fi
          fi

          has() {
            grep -qE "$1" <<< "$changed"
          }

          if [ "$full" = "false" ] && has '^\.github/workflows/'; then
            full=true
          fi

          if [ "$full" = "true" ]; then
            ds_bot=true
            node22=true
            app_unit=true
            app_package_full=true
            app_package_linux=true
            app_update=true
            mobile=true
            mobile_ios=true
            link=true
            docker=true
          else
            ds_bot=false
            node22=false
            app_unit=false
            app_package_full=false
            app_package_linux=false
            app_update=false
            mobile=false
            mobile_ios=false
            link=false
            docker=false
            if has '^(ds-bot/|link/|start\.ps1$)'; then ds_bot=true; fi
            if has '^(app/|ds-bot/|link/|README\.md$|README\.zh\.md$)'; then app_unit=true; fi
            if has '^(app/|ds-bot/package\.json$|ds-bot/package-lock\.json$|ds-bot/cordis\.patch\.yml$|ds-bot/office\.js$|ds-bot/src/office/|ds-bot/src/host/computer/)'; then app_package_full=true; fi
            if [ "$app_package_full" = "true" ]; then app_package_linux=true; fi
            if has '^app/'; then app_update=true; fi
            if has '^(mobile/|link/|ds-bot/package\.json$|ds-bot/src/shared/|ds-bot/src/client/(i18n|themes|inks|characters)\.js$)'; then mobile=true; fi
            if has '^(mobile/|ds-bot/package\.json$)'; then mobile_ios=true; fi
            if has '^link/'; then link=true; fi
            if has '^(docker/|docker-compose.*\.yml$|\.dockerignore$|ds-bot/package\.json$|ds-bot/package-lock\.json$|ds-bot/\.npmrc$|ds-bot/cordis\.patch\.yml$|ds-bot/plugin\.js$)'; then docker=true; fi
            # Rapid merges to dev can supersede intermediate queued pushes, so always run the
            # fast Linux/Windows baseline checks and publish :dev on push to dev without using macOS runners.
            if [ "$EVENT" = "push" ]; then
              ds_bot=true
              node22=true
              app_unit=true
              app_package_linux=true
              docker=true
            fi
          fi

          {
            echo "full=$full"
            echo "ds_bot=$ds_bot"
            echo "node22=$node22"
            echo "app_unit=$app_unit"
            echo "app_package_full=$app_package_full"
            echo "app_package_linux=$app_package_linux"
            echo "app_update=$app_update"
            echo "mobile=$mobile"
            echo "mobile_ios=$mobile_ios"
            echo "link=$link"
            echo "docker=$docker"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    needs: changes
    if: needs.changes.outputs.ds_bot == 'true'
    runs-on: ${{ matrix.os }}
    # The suite takes a few minutes; a test that never settles used to hold the job for the
    # runner's six-hour limit.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24, browser: true, lint: true }
          - { os: windows-latest, node: 24 }
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - name: Cache DSH test harness
        id: harness-cache
        uses: actions/cache@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ hashFiles('ds-bot/dev/harness/package.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - run: npm test
      - name: Lint
        if: matrix.lint
        run: npm run lint
      # The Bot browser and settings layout tests drive a real Chromium; one Linux run is enough.
      - name: Cache Playwright Chromium
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ds-bot/package-lock.json') }}
      - name: Install Chromium for the browser tests
        if: matrix.browser
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Browser tests
        if: matrix.browser
        run: npm run test:browser

  test-node22:
    name: ubuntu-latest · Node 22
    needs: changes
    if: needs.changes.outputs.node22 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ds-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ds-bot/package-lock.json
            link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - name: Cache DSH test harness
        id: harness-cache
        uses: actions/cache@v4
        with:
          path: ds-bot/dev/harness/node_modules
          key: dsh-harness-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('ds-bot/dev/harness/package.json') }}
      - name: Install DSH test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: npm run harness
      - run: npm test

  scan:
    name: Leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Scan exactly the tracked files, as they would be published.
      - run: mkdir -p "$RUNNER_TEMP/tree" && git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
      - run: node scripts/scan.mjs "$RUNNER_TEMP/tree"
        env:
          SCAN_EXTRA_PATTERNS: ${{ secrets.SCAN_EXTRA_PATTERNS }}

  app:
    name: Desktop app profile
    needs: changes
    if: needs.changes.outputs.app_unit == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The test composes the profile and starts no window, so it needs no Electron binary.
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  mobile:
    name: Mobile app typecheck
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            link/package-lock.json
      # The app type-checks the shared code in ../link, which has its own packages.
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test

  mobile-ios:
    name: Mobile app iOS build (simulator)
    needs: changes
    if: needs.changes.outputs.mobile_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # CocoaPods normalizes paths as UTF-8; a C locale fails `pod install`.
      LANG: en_US.UTF-8
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            link/package-lock.json
      # The app imports the shared code in ../link, which has its own packages.
      - name: Install the phone link's packages
        run: npm ci --no-fund --no-audit --prefix ../link
      - run: npm ci --no-fund --no-audit
      # ios/ is generated by the build and not committed (see mobile/README.md); this is
      # the same prebuild the release script runs.
      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile') }}
          restore-keys: cocoapods-${{ runner.os }}-
      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install
      # Unsigned: this proves the app compiles for the simulator. Signing and the
      # TestFlight upload need the Apple account (docs/plans/2026-11-13-ios-release.md).
      - name: Build for the simulator
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace DSBot.xcworkspace -scheme DSBot \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

  link:
    name: Phone link and Relay Server
    needs: changes
    if: needs.changes.outputs.link == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: link
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: link/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test

  app-package:
    name: Desktop app package (Windows)
    needs: changes
    if: needs.changes.outputs.app_package_full == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Electron and electron-builder's build tools come from GitHub releases, which sometimes answer
      # 504. The key holds the Electron and electron-builder versions and the builder config, which
      # decide the files downloaded.
      - name: Name the download cache
        id: downloads-key
        run: echo "key=electron-downloads-${{ runner.os }}-${{ runner.arch }}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-${{ hashFiles('app/electron-builder.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.downloads-key.outputs.key }}
      - run: npm ci --no-fund --no-audit
      - name: Run desktop app unit tests (Windows)
        run: npm test
      - run: node scripts/seed-electron-checksums.mjs
      - name: Cache the locked runtime archives
        uses: actions/cache@v4
        with:
          # A cache from another lock version cannot supply a wrong runtime: the archives are
          # stored under their sha256 and every read is verified against it again.
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
        env:
          # CI packages are never published; fast compression cuts archive time dramatically.
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      # Saved as soon as the build is done, so a later check that fails does not drop the downloads.
      - name: Save Electron and the build tools
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # The runner is a fresh machine, so the installer may run here. It must install for the
      # current user only, the installed app must pass check-packed, and the uninstaller must
      # remove it again.
      - name: Install and check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Entry($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'DS Bot*' }
          }
          $installer = Get-Item dist-pack/DS-Bot-*-win-x64.exe
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\DS Bot'
          $exe = Join-Path $dir 'DS Bot.exe'
          if (-not (Test-Path $exe)) { throw "The installer did not put the app in $dir" }
          $entry = Find-Entry 'HKCU:'
          if (-not $entry) { throw 'No uninstall entry for the current user' }
          if (Find-Entry 'HKLM:') { throw 'The installer installed for all users' }
          node scripts/check-packed.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its check' }

      # The update builds the app a second time, so it runs only for changes to the app or workflows
      # (and full runs). A build of the next version is the feed; the installed app downloads it,
      # checks its sha512, and installs it as it quits.
      - name: Build the next version
        if: needs.changes.outputs.app_update == 'true'
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        run: |
          next="$(node -p "const [a, b, c] = require('./package.json').version.split(/[.-]/u); [a, b, Number(c) + 1].join('.')")"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          npx electron-builder --publish never -c.extraMetadata.version="$next" -c.directories.output=dist-next
      - name: Update the installed app and check it
        if: needs.changes.outputs.app_update == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DS Bot\DS Bot.exe'
          node scripts/check-update.mjs $exe dist-next
          if ($LASTEXITCODE -ne 0) { throw 'The installed app did not take the update' }
          # The installer goes on after the app has quit.
          function Installed-Version {
            Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
              ForEach-Object { Get-ItemProperty $_.PSPath } |
              Where-Object { $_.DisplayName -like 'DS Bot*' } |
              Select-Object -ExpandProperty DisplayVersion
          }
          $deadline = (Get-Date).AddSeconds(240)
          while ((Installed-Version) -ne $env:NEXT_VERSION -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if ((Installed-Version) -ne $env:NEXT_VERSION) { throw "The installed version is $(Installed-Version), not $env:NEXT_VERSION" }
          while ((Get-Process | Where-Object { $_.Path -like '*dsbot-updater*' }) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          node scripts/check-packed.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'The updated app failed its check' }

      - name: Uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Entry($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'DS Bot*' }
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\DS Bot'
          $exe = Join-Path $dir 'DS Bot.exe'
          # The uninstaller removes the program only: the data location and the app's own data stay.
          $kept = foreach ($folder in (Join-Path $HOME '.ds-bot'), (Join-Path $env:APPDATA 'DS Bot')) {
            New-Item -ItemType Directory -Force $folder | Out-Null
            $file = Join-Path $folder 'kept.txt'
            Set-Content $file 'kept'
            $file
          }
          $uninstaller = Join-Path $dir 'Uninstall DS Bot.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/currentuser', '/S' -Wait
          # The uninstaller goes on from a copy in the temp folder, so wait for its result.
          $deadline = (Get-Date).AddSeconds(120)
          while (((Test-Path $exe) -or (Find-Entry 'HKCU:')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw 'The uninstaller left the app in place' }
          if (Find-Entry 'HKCU:') { throw 'The uninstaller left its uninstall entry' }
          foreach ($file in $kept) { if (-not (Test-Path $file)) { throw "The uninstaller removed $file" } }

  app-package-macos:
    name: Desktop app package (macOS ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.app_package_full == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Electron and electron-builder's build tools come from GitHub releases, which sometimes answer
      # 504. The key holds the Electron and electron-builder versions and the builder config, which
      # decide the files downloaded.
      - name: Name the download cache
        id: downloads-key
        run: echo "key=electron-downloads-${{ runner.os }}-${{ runner.arch }}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-${{ hashFiles('app/electron-builder.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ steps.downloads-key.outputs.key }}
      - run: npm ci --no-fund --no-audit
      - name: Run desktop app unit tests (macOS)
        if: matrix.arch == 'arm64'
        run: npm test
      - run: node scripts/seed-electron-checksums.mjs
      - name: Cache the locked runtime archives
        uses: actions/cache@v4
        with:
          # A cache from another lock version cannot supply a wrong runtime: the archives are
          # stored under their sha256 and every read is verified against it again.
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
        env:
          # Ad-hoc identity '-' uses no certificate or secret, so PR signing is safe; otherwise electron-builder skips signing and leaves an unsealed bundle.
          CSC_FOR_PULL_REQUEST: 'true'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      # Saved as soon as the build is done, so a later check that fails does not drop the downloads.
      - name: Save Electron and the build tools
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Install from the zip and check
        run: |
          zip="dist-pack/DS-Bot-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          test -f "$zip"
          ditto -x -k "$zip" /Applications
          app="/Applications/DS Bot.app"
          exe="$app/Contents/MacOS/DS Bot"
          codesign --verify --deep --strict "$app"
          file "$exe"
          expected="${{ matrix.arch }}"
          if [ "$expected" = x64 ]; then expected=x86_64; fi
          file -b "$exe" | grep -F "$expected"
          node scripts/check-packed.mjs "$exe"
          node scripts/check-update.mjs "$exe" 99.0.0

  app-package-linux:
    name: Desktop app package (Linux x64)
    needs: changes
    if: needs.changes.outputs.app_package_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Electron and electron-builder's build tools come from GitHub releases, which sometimes answer
      # 504. The key holds the Electron and electron-builder versions and the builder config, which
      # decide the files downloaded.
      - name: Name the download cache
        id: downloads-key
        run: echo "key=electron-downloads-${{ runner.os }}-${{ runner.arch }}-$(node -p "const d = require('./package.json').devDependencies; 'electron-' + d.electron + '-builder-' + d['electron-builder']")-${{ hashFiles('app/electron-builder.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Electron and the build tools
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ steps.downloads-key.outputs.key }}
      - run: npm ci --no-fund --no-audit
      - run: node scripts/seed-electron-checksums.mjs
      - name: Cache the locked runtime archives
        uses: actions/cache@v4
        with:
          # A cache from another lock version cannot supply a wrong runtime: the archives are
          # stored under their sha256 and every read is verified against it again.
          path: app/build/runtime-cache
          key: runtime-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/scripts/primary-runtime.lock.json') }}
      - run: npm run dist
      # Saved as soon as the build is done, so a later check that fails does not drop the downloads.
      - name: Save Electron and the build tools
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check the packages
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "dist-pack/DS-Bot-$version-linux-x86_64.AppImage"
          test -f "dist-pack/DS-Bot-$version-linux-amd64.deb"
          test -f dist-pack/latest-linux.yml
      # An AppImage mounts through FUSE 2, and Ubuntu 24.04's AppArmor blocks the unprivileged
      # user namespaces that Chromium's sandbox needs; a throwaway runner may lift that.
      - name: Prepare to run the app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2t64 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # apt-get, not dpkg: it also installs the deb's dependencies. The ./ prefix makes apt-get
      # read a file; without it the path is taken for a package name.
      - name: Install the deb and check
        run: |
          version="$(node -p "require('./package.json').version")"
          sudo apt-get install -y "./dist-pack/DS-Bot-$version-linux-amd64.deb"
          test -f /usr/share/applications/dsbot.desktop
          xvfb-run -a node scripts/check-packed.mjs "/opt/DS Bot/dsbot"
      # A deb cannot update itself: it points at the release page, as on macOS.
      - name: The deb's app hears of a new version
        run: xvfb-run -a node scripts/check-update.mjs "/opt/DS Bot/dsbot" 99.0.0
      # The update builds the app a second time, so it runs only for changes to the app or workflows
      # (and full runs). The AppImage downloads the new one and replaces itself as it quits.
      - name: Build the next version
        if: needs.changes.outputs.app_update == 'true'
        run: |
          next="$(node -p "const [a, b, c] = require('./package.json').version.split(/[.-]/u); [a, b, Number(c) + 1].join('.')")"
          npx electron-builder --publish never -c.extraMetadata.version="$next" -c.directories.output=dist-next
      - name: The AppImage takes the update
        if: needs.changes.outputs.app_update == 'true'
        run: |
          tmp="$(mktemp -d)"
          cp dist-pack/DS-Bot-*-linux-x86_64.AppImage "$tmp/dsbot.AppImage"
          chmod +x "$tmp/dsbot.AppImage"
          xvfb-run -a node scripts/check-update.mjs "$tmp/dsbot.AppImage" dist-next
          pkill -f "$tmp/dsbot" || true
          next="$(ls dist-next/DS-Bot-*-linux-x86_64.AppImage)"
          test "$(sha512sum "$tmp/dsbot.AppImage" | cut -d' ' -f1)" = "$(sha512sum "$next" | cut -d' ' -f1)"
      - name: Uninstall
        run: |
          sudo apt-get remove -y dsbot
          test ! -e "/opt/DS Bot/dsbot"

  docker:
    name: Docker startup and data migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, test, scan]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && needs.scan.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.changes.outputs.docker == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker/compose.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ds-bot:test
          load: true
          push: false
          cache-from: type=gha,scope=docker-prod
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=docker-prod' || '' }}
      - run: node docker/test.mjs ds-bot:test
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: ds-bot:dev-test
          load: true
          push: false
          cache-from: type=gha,scope=docker-dev
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=docker-dev' || '' }}
      - run: node docker/test-dev.mjs ds-bot:dev-test ds-bot:test
      - name: Publish the tested image
        if: github.event_name == 'push' && github.repository == 'Fei2411/DS-Bot'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_BRANCH: ${{ github.ref_name }}
          GHCR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GHCR_REPOSITORY,,}"
          case "$GHCR_BRANCH" in
            main) tag=latest ;;
            dev) tag=dev ;;
            *) exit 0 ;;
          esac
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker tag ds-bot:test "$image:sha-$GHCR_SHA"
          docker tag ds-bot:test "$image:$tag"
          docker push "$image:sha-$GHCR_SHA"
          docker push "$image:$tag"

  # The one check that branch rules require. A job whose needs failed is skipped,
  # and GitHub counts a skipped required check as passed, so this job always runs
  # and fails unless every job required for the changed paths passed.
  result:
    name: Test result
    needs: [changes, test, test-node22, scan, app, mobile, mobile-ios, link, app-package, app-package-macos, app-package-linux, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          RUN_DS_BOT: ${{ needs.changes.outputs.ds_bot }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_NODE22: ${{ needs.changes.outputs.node22 }}
          NODE22_RESULT: ${{ needs.test-node22.result }}
          RUN_APP_UNIT: ${{ needs.changes.outputs.app_unit }}
          APP_RESULT: ${{ needs.app.result }}
          RUN_MOBILE: ${{ needs.changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          RUN_MOBILE_IOS: ${{ needs.changes.outputs.mobile_ios }}
          MOBILE_IOS_RESULT: ${{ needs.mobile-ios.result }}
          RUN_LINK: ${{ needs.changes.outputs.link }}
          LINK_RESULT: ${{ needs.link.result }}
          RUN_APP_PKG_FULL: ${{ needs.changes.outputs.app_package_full }}
          APP_WIN_RESULT: ${{ needs.app-package.result }}
          APP_MAC_RESULT: ${{ needs.app-package-macos.result }}
          RUN_APP_PKG_LINUX: ${{ needs.changes.outputs.app_package_linux }}
          APP_LINUX_RESULT: ${{ needs.app-package-linux.result }}
          RUN_DOCKER: ${{ needs.changes.outputs.docker }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" wanted="$2" actual="$3"
            if [ "$wanted" = "true" ]; then
              if [ "$actual" != "success" ]; then
                echo "::error::$name was required for these changes but ended with '$actual'"
                fail=1
              fi
            elif [ "$wanted" = "false" ]; then
              if [ "$actual" != "skipped" ] && [ "$actual" != "success" ]; then
                echo "::error::$name ended with '$actual'"
                fail=1
              fi
            else
              echo "::error::$name had unexpected requirement flag '$wanted' (result '$actual')"
              fail=1
            fi
          }
          check "changes" "true" "$CHANGES_RESULT"
          check "scan" "true" "$SCAN_RESULT"
          check "test" "$RUN_DS_BOT" "$TEST_RESULT"
          check "test-node22" "$RUN_NODE22" "$NODE22_RESULT"
          check "app" "$RUN_APP_UNIT" "$APP_RESULT"
          check "mobile" "$RUN_MOBILE" "$MOBILE_RESULT"
          check "mobile-ios" "$RUN_MOBILE_IOS" "$MOBILE_IOS_RESULT"
          check "link" "$RUN_LINK" "$LINK_RESULT"
          check "app-package" "$RUN_APP_PKG_FULL" "$APP_WIN_RESULT"
          check "app-package-macos" "$RUN_APP_PKG_FULL" "$APP_MAC_RESULT"
          check "app-package-linux" "$RUN_APP_PKG_LINUX" "$APP_LINUX_RESULT"
          check "docker" "$RUN_DOCKER" "$DOCKER_RESULT"
          exit "$fail"
