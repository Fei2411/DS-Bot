<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%234d6bfe'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="DS Bot 的 Bot 市场界面构想：逛、看、接入、发布四种页面，以及接入时如何隔离记忆与权限。">
<meta name="theme-color" content="#fcfcfc">
<title>DS Bot Market — Bot 市场</title>
<style>
/* ─────────────  DS Bot 视觉语言 ───────────── */
:root{
  --bt-bg:#fcfcfc; --bt-card:#fff; --bt-sidebar:#f7f7f8; --bt-bubble:#f4f4f5;
  --bt-ink:#141414; --bt-ink-2:rgba(20,20,20,.6); --bt-ink-3:rgba(20,20,20,.36);
  --bt-line:rgba(20,20,20,.08); --bt-line-2:rgba(20,20,20,.15);
  --bt-hover:rgba(20,20,20,.04); --bt-active:rgba(20,20,20,.07);
  --bt-accent:#4d6bfe; --bt-accent-ink:#fff; --bt-accent-soft:rgba(77,107,254,.1);
  --bt-user:#4d6bfe; --bt-user-ink:#fff;
  --bt-green:#00c972; --bt-star:#ff9800; --bt-danger:#e02135; --bt-danger-soft:rgba(224,33,53,.08);
  --bt-shadow-1:0 2px 8px -1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --bt-shadow-2:0 10px 20px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --bt-shadow-3:0 8px 28px rgba(0,0,0,.14);
  --bt-shadow-4:0 24px 80px rgba(0,0,0,.24);
  --bt-ease:cubic-bezier(.22,1,.36,1);
  --bt-spring:cubic-bezier(.2,.9,.28,1.14);
  /* 角色墨色，浅色主题 */
  --i-deepseek:#4D6BFE; --i-charcoal:#141416; --i-graphite:#2D2D2D; --i-rose:#EC2F6B;
  --i-sky:#0AA8D6; --i-tangerine:#FF6900; --i-cobalt:#082DFF; --i-black:#000000;
  --i-brown:#9A6B44; --i-red:#FF3E51; --i-orange:#FF6B1A; --i-yellow:#FFB020;
  --i-green:#10B981; --i-cyan:#06B6D4; --i-blue:#2563EB; --i-violet:#8B5CF6;
  --i-magenta:#F43F85; --i-gray:#8A8F98; --i-aurora:#00B8D4;
  --g-aurora-0:#A4FFB0; --g-aurora-1:#00F0E4; --g-aurora-2:#2E9EF7;
}
body[data-ds-dark-theme]{
  --bt-bg:#141414; --bt-card:#1c1c1d; --bt-sidebar:#181819; --bt-bubble:#232324;
  --bt-ink:#f2f2f2; --bt-ink-2:rgba(242,242,242,.6); --bt-ink-3:rgba(242,242,242,.36);
  --bt-line:rgba(242,242,242,.09); --bt-line-2:rgba(242,242,242,.17);
  --bt-hover:rgba(242,242,242,.05); --bt-active:rgba(242,242,242,.09);
  --bt-accent:#5b7bff; --bt-accent-soft:rgba(91,123,255,.16);
  --bt-shadow-1:0 2px 8px -1px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --bt-shadow-2:0 10px 24px -3px rgba(0,0,0,.55),0 4px 8px -4px rgba(0,0,0,.4);
  --bt-shadow-3:0 8px 28px rgba(0,0,0,.5);
  --bt-shadow-4:0 24px 80px rgba(0,0,0,.6);
  --i-deepseek:#6A84FF; --i-charcoal:#F1F2F4; --i-graphite:#D6D6DA; --i-rose:#FF5A7A;
  --i-sky:#2EE6E0; --i-tangerine:#FF8A2E; --i-cobalt:#5C78FF; --i-black:#FFFFFF;
  --i-brown:#7C5332; --i-red:#E02135; --i-orange:#FF5E00; --i-yellow:#F59E0B;
  --i-green:#059669; --i-cyan:#0891B2; --i-blue:#3B82F6; --i-violet:#7C3AED;
  --i-magenta:#E11D74; --i-gray:#6E737B; --i-aurora:#2EE6E0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bt-bg); color:var(--bt-ink);
  font:400 13px/18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .16s ease,color .16s ease;
}
::selection{background:var(--bt-accent-soft)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--bt-accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
svg.i.s14{width:14px;height:14px}
svg.i.s12{width:12px;height:12px}
svg.i.s20{width:20px;height:20px}

/* ─────────────  顶栏 ───────────── */
.appbar{
  position:sticky; top:0; z-index:40; height:60px; display:flex; align-items:center; gap:14px;
  padding:0 20px; background:color-mix(in srgb,var(--bt-bg) 86%,transparent);
  backdrop-filter:saturate(160%) blur(14px); border-bottom:1px solid var(--bt-line);
}
.brand{display:flex;align-items:center;gap:9px;flex:none;cursor:pointer}
.brand .mark{width:30px;height:30px;display:grid;place-items:center}
.brand .mark svg{width:30px;height:30px}
.brand b{font-weight:600;font-size:15px;line-height:20px;letter-spacing:-.01em}
.brand i{font-style:normal;font-weight:500;font-size:11px;line-height:16px;color:var(--bt-ink-3);margin-left:5px;letter-spacing:.04em;text-transform:uppercase}
.search{
  flex:1; max-width:420px; height:36px; display:flex; align-items:center; gap:8px; padding:0 10px;
  background:var(--bt-card); border:1px solid var(--bt-line); border-radius:10px; color:var(--bt-ink-3);
  transition:border-color .12s,box-shadow .12s,background .12s;
}
.search:focus-within{border-color:var(--bt-accent);box-shadow:0 0 0 3px var(--bt-accent-soft);color:var(--bt-ink-2)}
.search input{flex:1;border:0;background:none;outline:none;font-size:13px;color:var(--bt-ink)}
.search input::placeholder{color:var(--bt-ink-3)}
.search kbd{
  font-weight:500;font-size:10px;line-height:1;color:var(--bt-ink-3);border:1px solid var(--bt-line);border-radius:4px;
  padding:3px 4px;background:var(--bt-sidebar);letter-spacing:.04em
}
.nav{display:flex;align-items:center;gap:2px;margin-left:6px}
.navlink{
  height:32px;padding:0 11px;border-radius:8px;display:flex;align-items:center;gap:6px;
  font-weight:500;font-size:13px;color:var(--bt-ink-2);transition:background .12s,color .12s
}
.navlink:hover{background:var(--bt-hover);color:var(--bt-ink)}
.navlink.on{color:var(--bt-ink);background:var(--bt-hover)}
.navlink.on::after{content:"";position:absolute}
.navlink .n{margin-left:5px;font-size:11px;color:var(--bt-ink-3);font-variant-numeric:tabular-nums;font-weight:400}
.grow{flex:1}
.icon-btn{
  width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--bt-ink-2);
  transition:background .12s,color .12s
}
.icon-btn:hover{background:var(--bt-hover);color:var(--bt-ink)}
.pill-btn{
  height:36px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:7px;
  background:var(--bt-accent);color:var(--bt-accent-ink);font-weight:500;font-size:13px;
  box-shadow:0 1px 2px rgba(0,0,0,.06);transition:transform .18s var(--bt-spring),filter .12s,box-shadow .12s
}
.pill-btn:hover{filter:brightness(1.06);box-shadow:0 4px 14px -4px color-mix(in srgb,var(--bt-accent) 60%,transparent)}
.pill-btn:active{transform:scale(.97)}
.ghost-btn{
  height:36px;padding:0 14px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;
  font-weight:500;font-size:13px;color:var(--bt-ink);border:1px solid var(--bt-line);
  transition:background .12s,border-color .12s,transform .18s var(--bt-spring)
}
.ghost-btn:hover{background:var(--bt-hover);border-color:var(--bt-line-2)}
.ghost-btn:active{transform:scale(.98)}
.ghost-btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px;color:var(--bt-ink-2)}
.ghost-btn.sm:hover{color:var(--bt-ink)}

/* ─────────────  布局 ───────────── */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);gap:36px;max-width:1240px;margin:0 auto;padding:24px 24px 96px}
.rail{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:22px}
.rail h4{
  margin:0 0 6px;padding:0 8px;font-weight:500;font-size:11px;line-height:16px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--bt-ink-3)
}
.rail-item{
  height:30px;padding:0 8px;border-radius:8px;display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--bt-ink-2);width:100%;text-align:left;transition:background .12s,color .12s
}
.rail-item:hover{background:var(--bt-hover);color:var(--bt-ink)}
.rail-item.on{background:var(--bt-active);color:var(--bt-ink);font-weight:500}
.rail-item .n{margin-left:auto;font-size:11px;color:var(--bt-ink-3);font-variant-numeric:tabular-nums}
.rail-item svg{color:var(--bt-ink-3)}
.rail-item.on svg{color:var(--bt-ink)}
.rail-note{
  margin-top:10px;padding:10px;border-radius:10px;background:var(--bt-sidebar);border:1px solid var(--bt-line);
  font-size:11px;line-height:16px;color:var(--bt-ink-3)
}
.rail-note b{display:block;color:var(--bt-ink-2);font-weight:500;margin-bottom:2px;font-size:11px}

/* 内容列 */
.col{min-width:0;display:flex;flex-direction:column;gap:34px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sec-head h2{margin:0;font-weight:600;font-size:15px;line-height:20px;letter-spacing:-.005em}
.sec-head p{margin:0;font-size:12px;color:var(--bt-ink-2)}
.sec-head .more{margin-left:auto;font-size:12px;color:var(--bt-ink-2);display:flex;align-items:center;gap:3px}
.sec-head .more:hover{color:var(--bt-ink)}

/* ─────────────  精选 ───────────── */
.hero{
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:22px;align-items:center;
  padding:24px 24px 24px;border-radius:16px;border:1px solid var(--bt-line);background:var(--bt-card);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;right:-70px;top:-90px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,var(--bt-accent-soft),transparent 66%);
  pointer-events:none
}
.hero-eyebrow{display:flex;align-items:center;gap:7px;font-weight:500;font-size:11px;line-height:16px;letter-spacing:.06em;color:var(--bt-ink-3);text-transform:uppercase;position:relative}
.hero h1{margin:10px 0 8px;font-weight:600;font-size:22px;line-height:34px;letter-spacing:-.02em;position:relative}
.hero p{margin:0 0 18px;font-size:13px;line-height:1.62;color:var(--bt-ink-2);max-width:46ch;position:relative}
.hero-actions{display:flex;align-items:center;gap:10px;position:relative}
.hero-meta{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:12px;color:var(--bt-ink-3);position:relative}
.hero-art{position:relative;display:grid;place-items:center;height:100%}
.hero-art .orb{
  position:absolute;inset:8% 0;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--bt-accent) 18%,transparent),transparent 68%);
  filter:blur(6px)
}
.hero-art svg.char{position:relative;width:152px;height:152px;animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}

/* ─────────────  卡片 ───────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.card{
  position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;
  background:var(--bt-card);border:1px solid var(--bt-line);border-radius:12px;cursor:pointer;
  transition:transform .24s var(--bt-spring),box-shadow .16s ease,border-color .12s ease;
  animation:cardIn .32s var(--bt-ease) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-2px);box-shadow:var(--bt-shadow-2);border-color:var(--bt-line-2)}
.card:active{transform:translateY(0) scale(.995)}
.card-top{display:flex;align-items:center;gap:10px;min-width:0}
.av{
  position:relative;flex:none;display:grid;place-items:center;border-radius:50%;overflow:hidden;
  background:var(--bt-hover);transition:transform .3s var(--bt-spring)
}
.av svg{display:block;width:112%;height:112%}
.card:hover .av{transform:scale(1.06) rotate(-3deg)}
.av.s44{width:44px;height:44px}
.av.s36{width:36px;height:36px}
.av.s28{width:28px;height:28px}
.av.s64{width:64px;height:64px}
.av.s96{width:96px;height:96px}
.av.s112{width:112px;height:112px}
.card-name{min-width:0;flex:1}
.card-name b{display:block;font-weight:600;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-name span{display:block;font-weight:400;font-size:12px;line-height:16px;color:var(--bt-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tagline{
  margin:0;font-size:13px;line-height:18px;color:var(--bt-ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px
}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{
  height:20px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;
  font-size:11px;color:var(--bt-ink-2);background:var(--bt-hover)
}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:2px;padding-top:10px;border-top:1px solid var(--bt-line);font-size:11px;color:var(--bt-ink-2)}
.card-foot .who{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden}
.card-foot .who b{font-weight:400;color:var(--bt-ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot .dl{display:flex;align-items:center;gap:3px;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.add-btn{
  height:28px;padding:0 10px 0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:500;color:var(--bt-ink-2);border:1px solid var(--bt-line);
  transition:background .14s,color .14s,border-color .14s,transform .2s var(--bt-spring)
}
.card:hover .add-btn,.card:focus-within .add-btn{background:var(--bt-accent);color:var(--bt-accent-ink);border-color:transparent}
.add-btn:active{transform:scale(.94)}
.add-btn.is-in{color:var(--bt-green);border-color:transparent;background:rgba(0,201,114,.08)}
.card:hover .add-btn.is-in{background:rgba(0,201,114,.12);color:var(--bt-green)}
.verify{display:inline-flex;align-items:center;gap:3px;height:16px;padding:0 5px;border-radius:4px;font-size:10px;font-weight:500}
.verify.official{background:var(--bt-accent-soft);color:var(--bt-accent)}
.verify.verified{background:rgba(0,201,114,.12);color:#00a05c}
body[data-ds-dark-theme] .verify.verified{color:var(--bt-green)}
.verify svg{width:10px;height:10px;stroke-width:2}

/* ─────────────  详情页 ───────────── */
.detail-wrap{animation:pageIn .26s var(--bt-ease) both}
@keyframes pageIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:12px;color:var(--bt-ink-3)}
.crumbs button{display:inline-flex;align-items:center;gap:5px;color:var(--bt-ink-2);font-size:12px}
.crumbs button:hover{color:var(--bt-ink)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.d-hero{display:flex;gap:16px;align-items:flex-start;padding-bottom:20px;border-bottom:1px solid var(--bt-line);margin-bottom:22px}
.d-hero .txt{min-width:0;padding-top:2px}
.d-hero h1{margin:0 0 4px;font-weight:600;font-size:22px;line-height:30px;letter-spacing:-.02em}
.d-hero .role{font-size:13px;line-height:18px;color:var(--bt-ink-2)}
.d-hero .byrow{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--bt-ink-3)}
.d-hero .byrow b{font-weight:500;color:var(--bt-ink-2)}
.d-hero .byrow .sep{width:3px;height:3px;border-radius:50%;background:var(--bt-ink-3);opacity:.6}
.d-sec{margin-bottom:26px}
.d-sec h3{margin:0 0 10px;font-weight:600;font-size:15px;line-height:20px}
.d-sec h3 small{font-weight:400;font-size:12px;color:var(--bt-ink-3);margin-left:8px}
.d-sec p{margin:0 0 10px;font-size:13px;line-height:1.72;color:var(--bt-ink-2)}
.d-sec p strong{color:var(--bt-ink);font-weight:500}
.ps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.ps li{display:flex;gap:9px;font-size:13px;line-height:1.6;color:var(--bt-ink-2)}
.ps li svg{margin-top:2px;color:var(--bt-accent);flex:none}
.ps li b{color:var(--bt-ink);font-weight:500}

/* 示例对话 */
.chat{padding:16px;border:1px solid var(--bt-line);border-radius:12px;background:var(--bt-card);display:flex;flex-direction:column;gap:10px}
.bub{max-width:78%;padding:7px 12px;border-radius:18px;font-size:13px;line-height:20px;position:relative}
.bub.u{align-self:flex-end;background:var(--bt-user);color:var(--bt-user-ink);border-bottom-right-radius:6px}
.bub.b{align-self:flex-start;background:var(--bt-bubble);border-bottom-left-radius:6px}
.bub.b .mini{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:11px;color:var(--bt-ink-3)}
.chat-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--bt-ink-3);margin:2px 0 4px}
.chat-label::after{content:"";flex:1;height:1px;background:var(--bt-line)}

/* 权限行 */
.perm{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bt-line);border-radius:10px;background:var(--bt-card)}
.perm + .perm{margin-top:8px}
.perm .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--bt-hover);color:var(--bt-ink-2);flex:none}
.perm .t{min-width:0;flex:1}
.perm .t b{display:block;font-weight:500;font-size:13px;line-height:18px}
.perm .t span{font-size:12px;line-height:16px;color:var(--bt-ink-3)}
.risk{height:20px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;font-size:11px;flex:none;margin-top:1px}
.risk.read{background:var(--bt-hover);color:var(--bt-ink-2)}
.risk.write{background:rgba(255,152,0,.12);color:#b26a00}
body[data-ds-dark-theme] .risk.write{color:var(--bt-star)}
.risk.danger{background:var(--bt-danger-soft);color:var(--bt-danger)}

/* 版本记录 */
.log{display:flex;flex-direction:column;gap:0}
.log-row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--bt-line)}
.log-row:first-child{border-top:0}
.log-v{font-weight:500;font-size:12px;line-height:18px;font-variant-numeric:tabular-nums;width:52px;flex:none;color:var(--bt-ink-2)}
.log-t{flex:1;font-size:13px;line-height:18px;color:var(--bt-ink-2)}
.log-w{font-size:11px;color:var(--bt-ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.log-row.now .log-v{color:var(--bt-accent)}
.log-row.now .log-t{color:var(--bt-ink)}

/* 右侧安装卡 */
.buy{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--bt-line);border-radius:12px;background:var(--bt-card);box-shadow:var(--bt-shadow-1)}
.buy .cta{width:100%;height:40px;justify-content:center;font-size:14px}
.buy .sub{display:flex;gap:8px}
.buy .sub .ghost-btn{flex:1;justify-content:center;font-size:12px;height:32px}
.dl{display:flex;flex-direction:column;gap:0;margin-top:2px}
.dl-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12px;color:var(--bt-ink-3)}
.dl-row b{font-weight:500;color:var(--bt-ink-2);font-variant-numeric:tabular-nums}
.buy-note{display:flex;gap:7px;padding:9px 10px;border-radius:8px;background:var(--bt-sidebar);font-size:11px;line-height:16px;color:var(--bt-ink-2)}
.buy-note svg{flex:none;margin-top:1px;color:var(--bt-accent)}
.buy-foot{display:flex;gap:14px;padding-top:2px;font-size:11px;color:var(--bt-ink-3)}
.buy-foot button:hover{color:var(--bt-ink)}

/* ─────────────  我的接入 ───────────── */
.inst{display:flex;flex-direction:column;gap:8px}
.inst-row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--bt-line);
  border-radius:12px;background:var(--bt-card);transition:border-color .12s,box-shadow .12s
}
.inst-row:hover{border-color:var(--bt-line-2);box-shadow:var(--bt-shadow-1)}
.inst-row .t{flex:1;min-width:0}
.inst-row .revoked{display:flex;align-items:center;gap:4px;font-size:11px;line-height:16px;color:var(--bt-ink-3);margin-top:2px}
.inst-row .revoked .i{flex:none}
.inst-row .t b{display:block;font-weight:500;font-size:13px;line-height:20px}
.inst-row .t span{font-size:11px;line-height:16px;color:var(--bt-ink-3);display:flex;gap:6px;align-items:center}
.state{height:22px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;white-space:nowrap}
.state.up{background:var(--bt-accent-soft);color:var(--bt-accent)}
.state.ok{background:var(--bt-hover);color:var(--bt-ink-3)}
.state.local{background:rgba(0,201,114,.1);color:#00a05c}
.state.on{background:var(--bt-hover);color:var(--bt-ink-2)}
body[data-ds-dark-theme] .state.local{color:var(--bt-green)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar .t{font-size:12px;color:var(--bt-ink-3)}

/* ─────────────  发布流程 ───────────── */
.pub{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:32px;align-items:start;animation:pageIn .26s var(--bt-ease) both}
.steps{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:10px;padding:8px;border-radius:8px;font-size:13px;color:var(--bt-ink-3);text-align:left;transition:background .12s,color .12s}
.step .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--bt-line-2);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums;flex:none;transition:all .2s var(--bt-spring)}
.step.on{color:var(--bt-ink);background:var(--bt-hover);font-weight:500}
.step.on .n{background:var(--bt-ink);color:var(--bt-bg);border-color:transparent}
.step.done{color:var(--bt-ink-2)}
.step.done .n{background:var(--bt-green);border-color:transparent;color:#fff}
.pub-pane{border:1px solid var(--bt-line);border-radius:14px;background:var(--bt-card);padding:24px;min-height:440px;display:flex;flex-direction:column}
.pub-pane h2{margin:0 0 4px;font-weight:600;font-size:17px;line-height:24px;letter-spacing:-.01em}
.pub-pane .hint{margin:0 0 20px;font-size:12px;line-height:18px;color:var(--bt-ink-3)}
.pub-foot{margin-top:auto;padding-top:20px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--bt-ink-2);margin-bottom:6px;font-weight:500}
.field .help{font-size:11px;color:var(--bt-ink-3);margin-top:5px}
.inp{
  width:100%;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--bt-line);
  background:var(--bt-bg);font-size:13px;outline:none;transition:border-color .12s,box-shadow .12s
}
.inp:focus{border-color:var(--bt-accent);box-shadow:0 0 0 3px var(--bt-accent-soft)}
textarea.inp{height:auto;min-height:76px;padding:8px 10px;line-height:20px;resize:vertical;font-family:inherit}
.count{float:right;font-size:11px;color:var(--bt-ink-3);font-variant-numeric:tabular-nums}
.count.warn{color:var(--bt-star)}
.seg{display:inline-flex;padding:2px;border-radius:10px;background:var(--bt-hover);gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:12px;color:var(--bt-ink-2);transition:all .16s var(--bt-ease)}
.seg button.on{background:var(--bt-card);color:var(--bt-ink);box-shadow:var(--bt-shadow-1);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--bt-line);font-size:12px;
  color:var(--bt-ink-2);display:inline-flex;align-items:center;gap:5px;transition:all .14s
}
.chip:hover{border-color:var(--bt-line-2);color:var(--bt-ink)}
.chip.on{background:var(--bt-accent-soft);border-color:transparent;color:var(--bt-accent);font-weight:500}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pick button{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;border:1px solid transparent;background:var(--bt-hover);transition:all .16s var(--bt-spring)}
.pick button svg{width:76%;height:76%}
.pick button:hover{transform:translateY(-2px)}
.pick button.on{border-color:var(--bt-accent);background:var(--bt-accent-soft);box-shadow:0 0 0 2px var(--bt-accent-soft)}
.inks{display:flex;gap:6px;flex-wrap:wrap}
.inks button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;transition:transform .16s var(--bt-spring)}
.inks button:hover{transform:scale(1.12)}
.inks button.on{box-shadow:0 0 0 2px var(--bt-bg),0 0 0 3.5px var(--bt-ink)}
.scan{display:flex;flex-direction:column;gap:1px;border:1px solid var(--bt-line);border-radius:10px;overflow:hidden}
.scan-row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bt-bg);font-size:12px}
.scan-row .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.scan-row .ic.ok{background:rgba(0,201,114,.14);color:#00a05c}
.scan-row .ic.warn{background:rgba(255,152,0,.16);color:#b26a00}
body[data-ds-dark-theme] .scan-row .ic.ok{color:var(--bt-green)}
body[data-ds-dark-theme] .scan-row .ic.warn{color:var(--bt-star)}
.scan-row .t{flex:1;min-width:0}
.scan-row .t b{font-weight:500;display:block;font-size:12px;line-height:16px}
.scan-row .t span{font-size:11px;line-height:15px;color:var(--bt-ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scan-row .fix{font-size:11px;color:var(--bt-accent)}

/* 预览卡 */
.preview{position:sticky;top:84px;display:flex;flex-direction:column;gap:10px}
.preview h4{margin:0;font-weight:500;font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--bt-ink-3)}
.preview .card{animation:none;cursor:default}

/* ─────────────  弹层 ───────────── */
.scrim{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.32);backdrop-filter:blur(2px);
  display:grid;place-items:center;padding:24px;animation:fade .16s ease both
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(560px,100%);max-height:min(760px,calc(100vh - 48px));overflow:auto;
  background:var(--bt-card);border-radius:16px;box-shadow:var(--bt-shadow-4);
  animation:rise .26s var(--bt-spring) both;position:relative
}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 0}
.modal-h .t{flex:1;min-width:0}
.modal-h h3{margin:0;font-weight:600;font-size:17px;line-height:24px;letter-spacing:-.01em}
.modal-h p{margin:4px 0 0;font-size:12px;line-height:18px;color:var(--bt-ink-3)}
.modal-b{padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;align-items:center;gap:8px;padding:14px 20px 20px}
.modal-f .grow{flex:1}
.btn-pri{
  height:36px;padding:0 16px;border-radius:999px;background:var(--bt-accent);color:var(--bt-accent-ink);
  font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;
  transition:filter .12s,transform .18s var(--bt-spring)
}
.btn-pri:hover{filter:brightness(1.06)}
.btn-pri:active{transform:scale(.97)}
.btn-ghost{height:36px;padding:0 14px;border-radius:10px;font-size:13px;color:var(--bt-ink-2);transition:background .12s,color .12s}
.btn-ghost:hover{background:var(--bt-hover);color:var(--bt-ink)}
.field-label{font-size:12px;color:var(--bt-ink-2);font-weight:500;margin-bottom:8px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-list.row{flex-direction:row}
.opt-list.row .opt{flex:1}
.field-note{display:flex;gap:7px;margin-top:8px;padding:9px 10px;border-radius:8px;background:var(--bt-sidebar);font-size:11px;line-height:16px;color:var(--bt-ink-2)}
.field-note .i{flex:none;margin-top:1px;color:var(--bt-ink-3)}
.opt{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--bt-line);
  border-radius:10px;cursor:pointer;transition:border-color .14s,background .14s;
  width:100%;text-align:left
}
.opt[disabled]{cursor:not-allowed;opacity:.45}
.opt[disabled]:hover{border-color:var(--bt-line);background:none}
.opt .t b{font-weight:500}
.opt:focus-visible{outline:2px solid var(--bt-accent);outline-offset:2px}
.fix.is-back{color:var(--bt-ink-3);border-color:transparent}
.opt:hover{border-color:var(--bt-line-2);background:var(--bt-hover)}
.opt.on{border-color:var(--bt-accent);background:var(--bt-accent-soft)}
.opt .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--bt-line-2);flex:none;display:grid;place-items:center;transition:border-color .14s}
.opt.on .radio{border-color:var(--bt-accent)}
.opt.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bt-accent)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:500;font-size:13px}
.opt .t span{font-size:11px;line-height:16px;color:var(--bt-ink-2)}
.opt .tail{font-size:11px;color:var(--bt-ink-3)}
.code{
  display:flex;align-items:center;justify-content:center;gap:6px;height:62px;
  border:1px dashed var(--bt-line-2);border-radius:12px;background:var(--bt-bg);
  font:600 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em
}
.linkbox{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;background:var(--bt-bg);
  border:1px solid var(--bt-line);font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--bt-ink-2)
}
.linkbox span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 三路对比 */
.diffsplit{display:grid;grid-template-columns:1fr 260px;gap:12px}
.dcol h5{margin:0 0 8px;font-size:11px;letter-spacing:.04em;color:var(--bt-ink-3);font-weight:500}
.dcol h5 .dim{color:var(--bt-ink-3);font-weight:400;letter-spacing:0}
.drow{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--bt-line);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:background .12s,border-color .12s}
.drow:hover{background:var(--bt-hover)}
.drow.on{border-color:var(--bt-accent);background:var(--bt-accent-soft)}
.drow input{margin:2px 0 0;accent-color:var(--bt-accent);flex:none}
.drow .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.drow .t em{font-style:normal;font-size:11px;color:var(--bt-ink-3)}
.drow code{display:inline-block;padding:1px 4px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
.drow-static{padding:8px 0;border-top:1px solid var(--bt-line);display:flex;flex-direction:column;gap:3px}
.drow-static:first-of-type{border-top:0}
.drow-static b{font-size:12px;font-weight:500;color:var(--bt-ink-2)}
.drow-static em{font-style:normal;font-size:11px;color:var(--bt-ink-3)}
.yours .drow-static:first-of-type{padding-top:2px}
.btn-pri.is-off{background:var(--bt-hover);color:var(--bt-ink-2)}
.dsplit-note{margin-top:6px;font-size:11px;color:var(--bt-ink-3)}
.diff3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--bt-line);border-radius:10px;overflow:hidden}
.diff3 > div{background:var(--bt-card);padding:12px;font-size:12px;line-height:18px}
.diff3 h5{margin:0 0 8px;font-size:11px;letter-spacing:.04em;color:var(--bt-ink-3);font-weight:500}
.diff3 .row{padding:6px 0;border-top:1px solid var(--bt-line);color:var(--bt-ink-2)}
.diff3 .row:first-of-type{border-top:0}
.add{color:#00a05c;background:rgba(0,201,114,.12)}
.del{color:var(--bt-danger);background:var(--bt-danger-soft)}
.mod{background:rgba(255,152,0,.14);color:#a86300}
body[data-ds-dark-theme] .add{color:var(--bt-green)}
body[data-ds-dark-theme] .mod{color:var(--bt-star)}
.diff3 code{padding:1px 3px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px}

/* toast */
.toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;
  background:var(--bt-ink);color:var(--bt-bg);font-size:13px;box-shadow:var(--bt-shadow-3);
  animation:toastIn .22s var(--bt-spring) both
}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .16s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.97)}}

/* 隐藏 */
[hidden]{display:none !important}
.fade-swap{animation:pageIn .22s var(--bt-ease) both}


/* ─────────────  页脚 + 设计说明 ───────────── */
.foot{
  max-width:1240px;margin:0 auto;padding:24px 20px 40px;display:flex;align-items:center;gap:12px;
  border-top:1px solid var(--bt-line);font-size:12px;color:var(--bt-ink-3)
}
.foot .sp{flex:1}
.foot button{display:inline-flex;align-items:center;gap:5px;color:var(--bt-ink-2);font-size:12px}
.foot button:hover{color:var(--bt-accent)}
.notes{max-width:720px;margin:0 auto;padding:8px 0 40px;animation:pageIn .26s var(--bt-ease) both}
.notes h1{font-weight:600;font-size:22px;line-height:34px;letter-spacing:-.02em;margin:6px 0 6px}
.notes .lede{font-size:14px;line-height:1.7;color:var(--bt-ink-2);margin:0 0 8px}
.notes h2{font-weight:600;font-size:15px;line-height:24px;margin:34px 0 10px;letter-spacing:-.01em}
.notes h2 .num{color:var(--bt-accent);font-variant-numeric:tabular-nums;margin-right:8px}
.notes p{font-size:13px;line-height:1.72;color:var(--bt-ink-2);margin:0 0 12px}
.notes ul{margin:0 0 14px;padding-left:0;list-style:none}
.notes ul li{position:relative;padding-left:16px;font-size:13px;line-height:1.72;color:var(--bt-ink-2);margin-bottom:7px}
.notes ul li::before{content:"";position:absolute;left:3px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--bt-ink-3)}
.notes b{color:var(--bt-ink);font-weight:600}
.notes code{padding:1px 4px;border-radius:4px;background:var(--bt-hover);font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--bt-ink-2)}
.notes .kv{display:grid;grid-template-columns:112px 1fr;gap:1px;background:var(--bt-line);border-radius:10px;overflow:hidden;margin:0 0 16px}
.notes .kv > div{background:var(--bt-card);padding:10px 12px;font-size:13px;line-height:1.62;color:var(--bt-ink-2)}
.notes .kv > div:nth-child(odd){color:var(--bt-ink-3);font-size:12px}
.notes .callout{
  border:1px solid var(--bt-line);border-left:2px solid var(--bt-accent);border-radius:0 10px 10px 0;
  padding:12px 14px;background:var(--bt-hover);font-size:13px;line-height:1.7;color:var(--bt-ink-2);margin:0 0 16px
}
.diffsplit{grid-template-columns:1fr}
@media (max-width:640px){
  .buy{position:sticky;bottom:68px;z-index:20;box-shadow:var(--bt-shadow-3);background:var(--bt-card)}
  .buy .dl,.buy .buy-note,.buy .buy-foot{display:none}
}
.dsplit .dcol.yours{margin-top:10px}
.dcol.yours{border-top:1px solid var(--bt-line);padding-top:10px}
@media (max-width:640px){
  .notes .kv{grid-template-columns:1fr}
  .notes .kv > div:nth-child(odd){padding-bottom:0}
  .scrim{padding:12px}
  .modal{max-height:calc(100vh - 24px)}
  .drow code{word-break:break-word}
}
/* ─────────────  响应式 ───────────── */
@media (max-width:1080px){
  .shell{grid-template-columns:1fr;gap:20px;padding:18px 18px 96px}
  .rail{display:none}
  .detail{grid-template-columns:1fr}
  .buy{position:static}
  .pub{grid-template-columns:1fr}
  .preview,.steps{position:static}
  .steps{flex-direction:row;align-items:center;overflow-x:auto;gap:4px;padding-bottom:4px;scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .step{flex:none;white-space:nowrap;padding:6px 8px;font-size:12px}
  .step .n{width:18px;height:18px;font-size:10px}
  .steps .rail-note{display:none}
  .preview{margin-top:18px}
}
@media (max-width:820px){
  .search{max-width:none}
  .nav{display:none}
  .hero{grid-template-columns:1fr}
  .hero-art{display:none}
  .grid{grid-template-columns:1fr 1fr}
  .pub-pane{padding:18px}
}
@media (max-width:640px){
  .appbar{padding:0 14px;gap:10px}
  .brand i{display:none}
  .grid{grid-template-columns:1fr}
  .hero{padding:20px}
  .hero h1{font-size:17px;line-height:24px}
  .shell{padding:14px 14px 90px}
  .d-hero{flex-direction:column;gap:12px}
  .diff3{grid-template-columns:1fr}
  .modal{border-radius:14px}
  .scrim{padding:0;align-items:flex-end}
  .modal{max-height:92vh;border-radius:16px 16px 0 0;width:100%}
  .modal-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .modal-h,.modal-b{padding-left:16px;padding-right:16px}
  .opt .t b{font-size:13px}
}

/* ─────────────  移动端底部导航 + 分类条 ───────────── */
.tabbar{display:none}
.catbar{display:none}
@media (max-width:820px){
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;height:60px;
    padding:0 8px calc(env(safe-area-inset-bottom,0px) + 4px);
    background:color-mix(in srgb,var(--bt-bg) 90%,transparent);
    backdrop-filter:saturate(160%) blur(16px);border-top:1px solid var(--bt-line);
    align-items:center;justify-content:space-around;
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;
    font-size:11px;color:var(--bt-ink-3);border-radius:10px;transition:color .14s,background .14s
  }
  .tabbar button.on{color:var(--bt-accent);background:var(--bt-accent-soft)}
  .tabbar svg{width:20px;height:20px;stroke-width:1.6}
  .shell{padding-bottom:88px !important}
  .catbar{
    display:flex;gap:6px;overflow-x:auto;padding:0 0 2px;margin:-2px 0 12px;
    scrollbar-width:none;-ms-overflow-style:none
  }
  .catbar::-webkit-scrollbar{display:none}
  .catbar button{
    flex:none;height:30px;padding:0 12px;border-radius:999px;font-size:12px;color:var(--bt-ink-2);
    background:var(--bt-hover);border:1px solid transparent;transition:all .14s
  }
  .catbar button.on{background:var(--bt-accent);color:var(--bt-accent-ink);border-color:transparent;font-weight:500}
  .appbar .pill-btn{padding:0 12px}
  .foot{padding:18px 16px 84px;flex-wrap:wrap}
}
@media (max-width:640px){
  .appbar .pill-btn{display:none}
  .appbar{gap:8px}
  .brand b{font-size:14px}
  .search{height:34px;min-width:0}
  .search kbd{display:none}
  .brand .mark,.brand .mark svg{width:26px;height:26px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important}
}
</style>

function filtered() {
  return BOTS.filter(b => {
    if (state.cat !== '全部' && !b.cats.includes(state.cat)) return false
    if (state.side === 'star' && !b.featured) return false
    if (state.side === 'official' && !b.official) return false
    if (state.side === 'private' && !b.local) return false
    if (!state.q) return true
    const k = state.q.toLowerCase()
    return (b.name + b.role + b.tagline + b.tags.join('') + b.author).toLowerCase().includes(k)
  })
}

function card(b, i = 0, preview = false) {
  const installed = state.installs.some(x => x.bot === b.id)
  const mark = preview ? '' : `data-bot="${b.id}" tabindex="0" role="link" aria-label="${esc(b.name)}，${esc(b.role)}"`
  return `<article class="card" ${mark} style="animation-delay:${Math.min(i * 26, 220)}ms">
    <div class="card-top">
      ${avatar(b, 44)}
      <div class="card-name">
        <b>${esc(b.name)}</b>
        <span>${esc(b.role)}</span>
      </div>
      ${b.official ? `<span class="verify official">${I.check}官方</span>` : b.verified ? `<span class="verify verified">${I.check}已认证</span>` : ''}

    <p class="card-tagline">${esc(b.tagline)}</p>
    <div class="tags">${b.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="card-foot">
      <span class="who">${I.folder}<b>${esc(b.author)}</b></span>
      <span class="dl">${I.dl}${b.installs.toLocaleString()}</span>

        : installed ? `<button class="add-btn is-in" data-add="${b.id}" aria-label="已接入 ${esc(b.name)}，查看">${I.check}已接入</button>`
        : `<button class="add-btn" data-add="${b.id}" aria-label="一键接入 ${esc(b.name)}">${I.plus}接入</button>`}

}

function viewNotes() {
  return `<div class="shell" style="grid-template-columns:minmax(0,1fr)">
    <div class="notes">
      <div class="crumbs"><button data-go="market">${I.back}回到市场</button></div>
      <h1>为什么是这四个页面</h1>
      <p class="lede">这份原型不是图，是能点的：市场、详情、我的接入、发布四屏，加上三个弹层。下面写清楚每个决定背后的取舍，以及哪些还没验证。</p>

      <h2><span class="num">01</span>市场页要能「逛」，不要求人先配置</h2>
      <p>参考的是一个通用形态：左边分类栏、中间卡片流、卡片上直接有一键接入。Grok 的 Bot Marketplace 用的也是这套骨架——但因为网络限制<b>没能抓到实际界面</b>（x.ai 与 grok.com 在本机一律超时），所以这里只借用「卡片浏览 + 一键接入」这个结构，视觉全部按 DS Bot 自己的规范重做，没有抄任何具体布局。</p>
      <ul>
        <li><b>卡片只放三件事</b>：它是什么（名字 + 一句话定位）、它替你做什么（两行说明）、别人用得怎么样（作者 + 接入数）。不放长介绍、不放截图——太长就没人往下滚。</li>
        <li><b>「一键接入」直接在卡片上</b>。这是最关键的取舍：逛的时候不需要先点进详情，觉得有用就接，接错了删掉成本很低。详情页是给犹豫的人看的，不是必经路径。</li>
        <li><b>精选区只放一个</b>。市场首页如果全是推荐位，会变成广告牌；留一个位置说「本周精选」，其余交给「大家都在用」和使用量排序。</li>
      </ul>

      <h2><span class="num">02</span>接入 = 新建一份独立副本，不是共享一个 Bot</h2>
      <p>这是整个设计里最需要先定的问题。DS Bot 的 Bot 数据是 <code>name + role + instructions + 形象 + 建议模型</code>，没有导出/导入格式；而 Bot 一旦跑起来就有<b>长期记忆、独立工作文件夹、权限</b>。所以市场能传的只有「提示词和形象」，不能传「状态」。</p>
      <div class="callout">
        接入时默认做三件事：把提示词和形象复制一份、新建一个空记忆、按你选的权限清单重新授权。作者那边永远看不到你的记忆和工作文件夹，你这边也拿不到作者的。
      </div>
      <ul>
        <li><b>装到哪儿</b>：个人空间 / 工作空间 / 某个群聊。这三个选项对应 DS Bot 里 Bot 能活的位置，接入时就要定，因为它决定了谁能用。</li>
        <li><b>权限逐项收回</b>：作者声明「要浏览器 + 要写文件」，接入页会一条条列出来，每条右边有「收回」。收掉的权限它会在需要时停下来问你——比一次性授权一个笼统的「完全访问」安全得多。</li>
        <li><b>同步策略单独问</b>：拿这一版就自己走，或者跟随作者更新。默认前者，因为没人希望别人改一次提示词，自己的 Bot 就悄悄变了。</li>
      </ul>

      <h2><span class="num">03</span>「我的接入」要能看清三件事</h2>
      <p>这页不是设置页，是维护页。用户真正会问的是：它还在跑吗？作者改了什么？我改过的地方会不会被冲掉？</p>
      <ul>
        <li><b>状态</b>：可更新 / 运行中 / 已暂停 / 本地 Agent。本地 Agent 单独一种状态，因为它跑在你自己的 Claude Code 上，出问题不是作者的锅。</li>
        <li><b>最近变动</b>：只放跟自己有关的。作者发新版、某个 Bot 停了、本地 Agent 升级了——三件事之外不要打扰。</li>
        <li><b>差异而不是覆盖</b>：作者更新后弹出逐条对比：左边列出他改动的每一段（可勾选），右边写着你自己改过哪两段、不会被覆盖。这是「能改提示词」和「能跟随更新」两个需求唯一的和平解法。</li>
      </ul>

      <h2><span class="num">04</span>发布只多问三样东西</h2>
      <p>Bot 本身已经是一个完整的东西了——名字、定位、提示词、形象。发布时不该让作者重写一遍，只补市场需要的元数据。</p>
      <div class="kv">
        <div>从哪儿开始</div><div>从我已经有的一个 Bot 发（推荐）、从空白建、导入 .dsbot 包</div>
        <div>形象与文案</div><div>名字 40 字、一句话 24 字、卡片说明两行；形象从 20 个自带形状里挑 + 19 个墨色，<b>不用做封面图</b></div>
        <div>权限自检</div><div>勾选它需要什么，同时自动扫描四类问题：硬编码密钥、作者的绝对路径、把作者记忆写进提示词、敏感动作（如「发给我的飞书」）</div>
        <div>提交审核</div><div>人审看三件事：能不能用、有没有夹带别人的数据、权限写得准不准</div>
        <div>发布之后</div><div>发布是<b>另存一份</b>：你本地那个 Bot 的名字、记忆、文件夹都不动，之后在本地改提示词也不会同步上去；要更新市场版本得重新发</div>
      </div>
      <p>形象这块值得单独说：DS Bot 的 <code>characters.js</code> 已经有 20 个原创形状和一套墨色，而且<b>没选形象时按 Bot id 派生</b>（FNV-1a + mulberry32），跨设备一致。所以发布流程里形象是「可以不选」的，市场卡片上的缩略图直接用这套 SVG 生成，作者一张图都不用传。原型里的所有头像都是这么来的。</p>

      <h2><span class="num">05</span>视觉上刻意跟 DS Bot 对齐</h2>
      <p>市场如果长得像另一个产品，用户不会信任它。所以颜色、字号、圆角、高度、动效全部取自 DS Bot 的 UI 标准（<code>docs/design/ui-standard.md</code>）：8 个基础色 + 深色变体、字号只用 11/12/13/14/15/17/22 那几档、圆角只用 6/8/10/12/16/999、按钮 36 与胶囊 40、过渡用弹簧曲线而不是 ease。</p>
      <p>图标全部是 20 单位画布的自绘描边图标，没有用任何图标库。</p>

      <h2><span class="num">06</span>没做和没验证的</h2>
      <ul>
        <li><b>没验证</b>：Grok Bot Marketplace 的实际交互。x.ai / grok.com 在本机不可达，只能按「卡片浏览 + 一键接入」的通用形态设想。这部分需要你对照一下真实产品。</li>
        <li><b>没验证</b>：真实 DS Bot 用户会不会接受「接入 = 独立副本」。如果大家其实想要「大家一起用一个 Bot」，那记忆和权限模型要重做。</li>
        <li><b>没做</b>：后端与鉴权、真实上传 .dsbot 包的解包校验、举报与下架流程的具体页面、搜索结果排序、收藏夹。</li>
        <li><b>没做</b>：数据全是虚构的 12 个 Bot，用于演示密度和排序；接入数、作者名都不是真实数据。</li>
      </ul>

      <div class="callout">
        下一步建议：先把「市场 + 详情 + 接入弹层」三屏拿给几个真实用 DS Bot 的人点一遍，重点看他们会不会在接入弹层犹豫、以及会不会真的去收回权限。这两点决定了这个市场是「能逛」还是「能用」。
      </div>
    </div>
  </div>`
}

/* ─────────── 弹层 ─────────── */
function modal(html, wide = false) {
  const s = document.createElement('div')
  s.className = 'scrim'
  const mid = 'dlg-' + Math.random().toString(36).slice(2, 8)
  s.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="${mid}" tabindex="-1">${html.replace(/<h3>/, `<h3 id="${mid}">`)}</div>`
  s.addEventListener('mousedown', e => { if (e.target === s) close(s) })
  document.body.appendChild(s)
  trapFocus(s.querySelector('.modal'))
  return s
}
function focusables(root) {
  return [...root.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null)
}
let lastFocus = null
function trapFocus(root) {
  lastFocus = document.activeElement
  root.focus()
  root.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return
    const f = focusables(root); if (!f.length) return
    const i = f.indexOf(document.activeElement)
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus() }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus() }
  })
}
function close(s) {
  s.style.animation = 'fade .16s ease reverse both'
  setTimeout(() => { s.remove(); if (lastFocus && document.contains(lastFocus)) lastFocus.focus() }, 140)
}

    n.textContent = on ? '保留' : '收回'
    n.classList.toggle('is-back', on)
    row.querySelector('.ic').className = `ic ${on ? 'ok' : 'warn'}`
    row.querySelector('.ic').innerHTML = on ? I.check : '!'
    row.querySelector('.t span').textContent = on ? '已收回，需要时它会停下来问你' : '可写，接入后可以随时收回'
    if (on) revoked.add(row.querySelector('.t b').textContent)
    else revoked.delete(row.querySelector('.t b').textContent)
  }))
  s.querySelector('[data-confirm]').addEventListener('click', () => {
    close(s)
    if (state.installs.some(x => x.bot === id)) { toast(`${b.name} 已经接入过了`); return }
    state.installs.unshift({
      bot: id, space: chosen.space, mode: chosen.sync, revoked: [...revoked],
      state: b.local ? 'local' : 'on', since: '已接入 · 刚刚'
    })
    toast(`已接入 ${b.name}，放在${chosen.space}`)
    render()
  })
}

function openSuccess(url) {
  const s = modal(`
    <div class="modal-h">
      <div class="t"><h3>提交成功</h3><p>通常 24 小时内出结果，通过后这个链接就能分享。</p></div>
      <button class="icon-btn" data-close aria-label="关闭">${I.x}</button>
    </div>
    <div class="modal-b">
      <div class="linkbox"><span>${esc(url)}</span><button class="icon-btn" data-copy aria-label="复制">${I.copy}</button></div>
      <div class="scan">
        <div class="scan-row"><span class="ic ok">${I.check}</span><span class="t"><b>自动检查通过</b><span>没有密钥、路径、他人数据</span></span></div>
        <div class="scan-row"><span class="ic warn">!</span><span class="t"><b>等待人工审核</b><span>预计 6 小时</span></span></div>
      </div>
      <div class="buy-note">${I.shield}<span>通过后你会收到一条通知；别人接入时看到的权限清单就是刚才确认的那份。</span></div>
    </div>
    <div class="modal-f"><span class="grow"></span><button class="btn-pri" data-close>好</button></div>`)
  s.querySelector('[data-copy]').addEventListener('click', () => toast('链接已复制'))
  s.querySelectorAll('[data-close]').forEach(n => n.addEventListener('click', () => close(s)))
}

function openDiff(id) {
  const b = BOTS.find(x => x.id === id)
  const it = state.installs.find(x => x.bot === id)
  const ver = b.versions[0]
  // 有手写改动就用手写的，没有就把这版更新说明按分句展开
  const rows = (b.changes || ver[1].split('；').map((t, i) => ['mod', '改了', t, `第 ${3 + i * 4} 段`])).map(([k, label, text, where]) => [k, label, text, where])
  const s = modal(`
    <div class="modal-h">
      <span class="av s44" style="width:44px;height:44px">${charSVG(b.shape, b.color)}</span>
      <div class="t"><h3>${it ? '作者改了什么' : '这版改了什么'}</h3><p>${esc(b.name)} · ${esc(ver[0])} · ${esc(ver[2])} · 提示词按段落对比</p></div>
      <button class="icon-btn" data-close aria-label="关闭">${I.x}</button>
    </div>
    <div class="modal-b">
      <div class="diffsplit">
        <div class="dcol">
          <h5>${it ? '作者的改动' : '这版的改动'} <span class="dim">${it ? rows.length + ' 处，勾上才会进你的副本' : rows.length + ' 处'}</span></h5>
          ${rows.map(([k, label, text, where], i) => it
            ? `<label class="drow ${i < 2 ? 'on' : ''}">
                <input type="checkbox" ${i < 2 ? 'checked' : ''} data-adopt>
                <span class="t"><code class="${k}">${esc(text)}</code><em>${label} · ${esc(where)}</em></span>
              </label>`
            : `<div class="drow drow-ro">
                <span class="t"><code class="${k}">${esc(text)}</code><em>${label} · ${esc(where)}</em></span>
              </div>`).join('')}
        </div>
        <div class="dcol yours">
          <h5>${it ? '你的副本' : '你还没接入'}</h5>
          ${it
            ? `<div class="drow-static"><b>2 处你改过</b><em>第 5 段「不要用表格」、第 9 段「称呼用你们」</em></div>
               <div class="drow-static"><b>上面这两段不会被覆盖</b><em>勾选的改动会插到别的位置</em></div>
               <div class="drow-static"><b>权限无变化</b><em>${esc(ver[0])} 没有新增权限</em></div>`
            : `<div class="drow-static"><b>只读预览</b><em>接入之后，这里才会显示你改过哪几段</em></div>
               <div class="drow-static"><b>没有可覆盖的东西</b><em>现在看到的改动不会写进任何地方</em></div>
               <div class="drow-static"><b>作者看不到你</b><em>浏览不会留下任何记录</em></div>`}
        </div>
      </div>
      <div class="buy-note">${I.shield}<span>提示词在 DS Bot 里是一整段文本，所以对比按空行切段：只把改动的那几段单独列出来。同一段双方都改过时不算冲突，会停下来让你选。</span></div>
    </div>
    <div class="modal-f"><button class="btn-ghost" data-close>${it ? '先不更新' : '知道了'}</button><span class="grow"></span>
      ${it ? `<button class="btn-pri" data-adopt-go>采纳勾选的 2 处</button>` : ''}</div>`, true)
  s.querySelectorAll('[data-close]').forEach(n => n.addEventListener('click', () => close(s)))
  const go = s.querySelector('[data-adopt-go]')
  if (!go) return
  const sync = () => {
    const n = s.querySelectorAll('.drow input:checked').length
    go.textContent = n ? `采纳勾选的 ${n} 处` : '不采纳任何改动'
    go.classList.toggle('is-off', !n)
  }
  s.querySelectorAll('.drow').forEach(n => {
    const box = n.querySelector('input')
    if (!box) return
    box.addEventListener('change', () => { n.classList.toggle('on', box.checked); sync() })
  })
  sync()
  go.addEventListener('click', () => {
    const n = s.querySelectorAll('.drow input:checked').length
    close(s)
    if (it) { it.state = 'on'; it.since = '已更新到 ' + ver[0] }
    toast(n ? `已采纳 ${n} 处，其余等你以后再看` : '这次没采纳任何改动')
    render()
  })
}

/* ─────────── toast ─────────── */
function toast(msg) {
  const box = document.getElementById('toasts')
  const el = document.createElement('div')
  el.className = 'toast'
  el.innerHTML = `${I.check}${esc(msg)}`
  box.appendChild(el)
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200) }, 2000)
}

/* ─────────── 事件 ─────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-bot],[data-go],[data-cat],[data-toast],[data-diff],[data-step],[data-src],[data-side],[data-inst-filter],[data-shape],[data-color],[data-perm],[data-submit],[data-toggle]')
  if (!t) return

  if (t.dataset.add) { e.stopPropagation(); openAdd(t.dataset.add); return }
  if (t.dataset.diff) { openDiff(t.dataset.diff); return }
  if (t.dataset.toast) { toast(t.dataset.toast); return }
  if (t.dataset.go) {
    state.view = t.dataset.go
    if (state.view === 'market') state.bot = null
    render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return
  }
  if (t.dataset.toggle) {
    const it = state.installs.find(x => x.bot === t.dataset.toggle)
    it.state = it.state === 'ok' ? 'on' : 'ok'
    it.since = it.state === 'ok' ? '已暂停 · 刚刚' : '已接入 · 3 天前'
    render(); return
  }
  if (t.dataset.cat) {
    state.cat = t.dataset.cat; state.view = 'market'; render()
    document.querySelector('.col')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return
  }
  if (t.dataset.bot) {
    state.bot = BOTS.find(b => b.id === t.dataset.bot)
    state.view = 'detail'; render(); window.scrollTo({ top: 0 }); return
  }
  if (t.dataset.step) {
    state.step = Math.max(1, Math.min(4, +t.dataset.step))
    render(); return
  }
  if (t.dataset.src) { state.draft.source = t.dataset.src; render(); return }
  if (t.dataset.instFilter) { state.instFilter = t.dataset.instFilter; render(); return }
  if (t.dataset.side) {
    state.side = state.side === t.dataset.side ? null : t.dataset.side
    state.view = 'market'; render(); return
  }
  if (t.dataset.pick) {
    const m = state.mine.find(x => x.id === t.dataset.pick)
    Object.assign(state.draft, { pick: m.id, name: m.name, role: m.role, tagline: m.tagline })
    render(); return
  }
  if (t.dataset.shape) { state.draft.shape = t.dataset.shape; render(); return }
  if (t.dataset.color) { state.draft.color = t.dataset.color; render(); return }
  if (t.dataset.perm) {
    const k = t.dataset.perm, i = state.draft.perms.indexOf(k)
    i < 0 ? state.draft.perms.push(k) : state.draft.perms.splice(i, 1)
    render(); return
  }
  if (t.dataset.submit) { openSuccess('https://market.example.com/b/moon-7f3'); return }
})

document.addEventListener('input', e => {
  if (e.target.id === 'q') { state.q = e.target.value; if (state.view !== 'market') state.view = 'market'; render(); const el = document.getElementById('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); return }
  if (e.target.id === 'fName') { state.draft.name = e.target.value; syncPreview(); return }
  if (e.target.id === 'fRole') { state.draft.role = e.target.value; syncPreview(); return }
  if (e.target.id === 'fTag') { state.draft.tagline = e.target.value; syncPreview(); return }
})

function syncPreview() {
  const d = state.draft
  const c = document.querySelector('.preview .card')
  if (!c) return
  c.querySelector('.card-name b').textContent = d.name || '未命名 Bot'
  c.querySelector('.card-name span').textContent = d.role || '一句话说明'
  c.querySelector('.card-tagline').textContent = d.tagline || '卡片上那段话会出现在这里，说清它替你做什么。'
  const av = c.querySelector('.av')
  av.innerHTML = charSVG(d.shape, d.color)
  const cn = document.getElementById('cName'), cr = document.getElementById('cRole')
  if (cn) { cn.textContent = (d.name || '').length + '/40'; cn.classList.toggle('warn', (d.name || '').length > 36) }
  if (cr) { cr.textContent = (d.role || '').length + '/24'; cr.classList.toggle('warn', (d.role || '').length > 21) }
}

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.classList.contains('card')) {
    e.preventDefault()
    const id = document.activeElement.dataset.bot
    if (id && BOTS.find(b => b.id === id)) { state.bot = BOTS.find(b => b.id === id); state.view = 'detail'; render(); window.scrollTo({ top: 0 }) }
    return
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('q').focus() }
  if (e.key === 'Escape') { const s = document.querySelector('.scrim'); if (s) close(s) }
})

document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.body.hasAttribute('data-ds-dark-theme')
  document.body.toggleAttribute('data-ds-dark-theme', !dark)
  document.getElementById('themeBtn').innerHTML = dark
    ? '<svg class="i" viewBox="0 0 20 20"><path d="M16.2 12.4A6.8 6.8 0 0 1 7.6 3.8a6.9 6.9 0 1 0 8.6 8.6z"/></svg>'
    : '<svg class="i" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.6v1.8M10 15.6v1.8M2.6 10h1.8M15.6 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M15.3 4.7L14 6M6 14l-1.3 1.3"/></svg>'
})

render()
document.getElementById('markTop').innerHTML = charSVG('whale', 'deepseek')
</script>
</body>
</html>
