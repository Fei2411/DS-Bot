</div>
<ol class="track sr" data-t-label="status.track">
<li class="station" data-phase="data" data-state="pending"><span data-t="status.phase.data"></span> <span class="sr"></span></li>
<li class="station" data-phase="import" data-state="pending" hidden><span data-t="status.phase.import"></span> <span class="sr"></span></li>
<li class="station" data-phase="engine" data-state="pending"><span data-t="status.phase.engine"></span> <span class="sr"></span></li>
<li class="station" data-phase="team" data-state="pending"><span data-t="status.phase.team"></span> <span class="sr"></span></li>
</ol>
<p class="voice"><span></span></p>
<p class="caption"><span class="caption-text"></span></p>
<section class="sheet">
<div class="sheet-edge"></div><div class="sheet-fill"></div>
<div class="sheet-body">
<section class="card" data-kind="recommend" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.{reason}"></h2><p class="lead"><span data-t="reason.place.{reason}"></span> <span class="ask" data-t="card.recommend.ask"></span></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="rec" data-rec data-t="btn.useRec"></button><button class="btn" data-look="soft" data-act="answer" data-detail="keep" data-keep data-t="btn.keepDrive"></button><button class="btn" data-look="link" data-act="pick" data-rec data-t="btn.otherPlace"></button><button class="btn" data-look="primary" data-act="pick" data-norec data-t="btn.pickPlace"></button><p class="foot" data-t="note.changeLater"></p></div></section>
<section class="card" data-kind="rejected" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.rejected"></h2><p class="lead" data-t="reason.place.{reason}"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="pick" data-t="btn.repick"></button><button class="btn" data-look="soft" data-act="answer" data-detail="rec" data-rec data-t="btn.useRec"></button><button class="btn" data-look="soft" data-act="answer" data-detail="keep" data-keep data-t="btn.keepDrive"></button><p class="foot" data-t="note.changeLater"></p></div></section>
<section class="card" data-kind="missing" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.missing"></h2><p class="lead" data-t="card.missing.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="retry" data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="pick" data-t="btn.relocate"></button><button class="btn" data-look="soft" data-act="freshStart" data-t="btn.freshStart"></button></div><p class="miss" data-t="card.missing.retryMissed" hidden></p><p class="foot" data-t="note.changeLater"></p></section>
<section class="card" data-kind="picked" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.picked"></h2><p class="lead" data-t="card.picked.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="use" data-t="btn.continue"></button><button class="btn" data-look="soft" data-act="pick" data-t="btn.repick"></button><p class="foot" data-t="note.changeLater"></p></div></section>
<section class="card" data-kind="move" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.move"></h2><p class="lead" data-t="card.move.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="move" data-t="btn.move"></button><button class="btn" data-look="soft" data-act="pick" data-t="btn.repick"></button><button class="btn" data-look="soft" data-act="answer" data-detail="cancel" data-t="btn.cancel"></button></div></section>
<section class="card" data-kind="moveFailed" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.moveFailed"></h2><p class="lead"><span data-why="place" data-t="reason.place.{place}"></span><span data-why="inUse" data-t="card.moveFailed.inUse"></span><span data-why="copy" data-t="card.moveFailed.copy"></span> <span data-t="card.moveFailed.stay"></span></p><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="retry" data-why="copy" data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="answer" data-detail="old" data-old data-t="btn.startOld"></button><button class="btn disclose" data-look="link" data-act="toggleDetails" data-why="copy" aria-expanded="false"><span data-t="btn.details"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.2 8 9.7l3.5-3.5"/></svg></button></div><div class="log" hidden><pre></pre></div></div></section>
<section class="card" data-kind="import" hidden><div class="card-scroll"><h2 class="card-title" data-t="card.import.line"></h2><div class="more" hidden><p class="small" data-t="card.import.extra{bare}"></p><p class="small ink model-row"><span data-t="card.import.model"></span><button class="btn" data-look="link" data-act="toggleModels" aria-expanded="false" data-t="btn.changeModel"></button></p><ul class="models" hidden></ul><div class="opts"><label><input type="checkbox" data-opt="regen"><span data-t="card.import.optRegen"></span></label><label><input type="checkbox" data-opt="skipWork"><span data-t="card.import.optSkipWork"></span></label></div><p class="small" data-t="note.copyLater"></p></div></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="copy" data-t="btn.copy"></button><button class="btn" data-look="soft" data-act="answer" data-detail="skip" data-t="btn.skipCopy"></button><button class="btn disclose end" data-look="link" data-act="toggleMore" aria-expanded="false"><span data-t="btn.more"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.2 8 9.7l3.5-3.5"/></svg></button></div></section>
<section class="card" data-kind="importSpace" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.importSpace"></h2><p class="lead" data-t="card.importSpace.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="pick" data-t="btn.pickPlace"></button><button class="btn" data-look="soft" data-act="answer" data-detail="skip" data-t="btn.skipCopy"></button></div></section>
<section class="card" data-kind="inUse" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.inUse"></h2><p class="lead" data-t="card.inUse.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="skip" data-t="btn.skipCopy"></button></div></section>
<section class="card" data-kind="newerUpdating" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.newer"></h2><p class="lead" data-t="card.newerUpdating.lead"></p><p class="small"><span data-t="card.update.slow"></span> <button class="btn" data-look="link" data-act="manualDownload" data-t="btn.manualDownload"></button></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="skip" data-t="btn.skipCopy"></button></div></section>
<section class="card" data-kind="newer" hidden><div class="card-scroll"><h2 class="card-title" data-t="say.newer"></h2><p class="lead" data-t="card.newer.lead"></p></div><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="startWithout" data-t="btn.startWithout"></button><p class="foot" data-t="note.copyAgain"></p></div></section>
<section class="card" data-kind="importFailed" hidden><div class="card-scroll"><p class="lead" data-t="card.importFailed.lead"></p><p class="small do" data-t="card.importFailed.do"></p><div class="card-actions"><button class="btn" data-look="primary" data-act="answer" data-detail="retry" data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="answer" data-detail="startWithout" data-t="btn.startWithout"></button><button class="btn" data-look="soft" data-act="copyDetails" data-t="btn.copyDetails"></button><button class="btn" data-look="soft" data-act="saveLog" data-t="btn.saveLog"></button><button class="btn disclose" data-look="link" data-act="toggleDetails" aria-expanded="false"><span data-t="btn.details"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.2 8 9.7l3.5-3.5"/></svg></button></div><div class="log" hidden><pre></pre></div></div></section>
<section class="card" data-kind="watchdog" hidden><div class="card-actions"><button class="btn" data-look="primary" data-act="wait" data-t="btn.wait"></button><button class="btn" data-look="soft" data-act="retry" data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="copyDetails" data-t="btn.copyDetails"></button><button class="btn" data-look="soft" data-act="saveLog" data-t="btn.saveLog"></button></div></section>
<section class="card" data-kind="failed" hidden><div class="card-scroll"><p class="lead" data-t="reason.start.{reason}"></p><p class="small do" data-t="card.failed.do.{reason}"></p><div class="banner" hidden><div class="banner-row"><p class="lead" data-t="card.update.available"></p><button class="btn" data-look="primary" data-act="installUpdate" data-u="available" data-t="btn.download"></button></div><div class="banner-down" data-u="downloading"><p class="small banner-line"><span data-t="card.update.downloading"></span><span class="slow"><span data-t="card.update.slow"></span><button class="btn" data-look="link" data-act="manualDownload" data-t="btn.manualDownload"></button></span></p><div class="bar"><span class="bar-fill"></span></div></div><p class="small" data-u="installing" data-t="card.update.installing"></p><div class="banner-fail" data-u="failed"><p class="small danger" data-t="card.update.failed"></p><button class="btn" data-look="small" data-act="installUpdate" data-t="btn.retry"></button><button class="btn" data-look="small" data-act="manualDownload" data-t="btn.manualDownload"></button></div></div><div class="card-actions"><button class="btn" data-look="primary" data-act="retry" data-main data-t="btn.retry"></button><button class="btn" data-look="soft" data-act="pick" data-detail="changePlace" data-places data-t="btn.changePlace" hidden></button><button class="btn" data-look="soft" data-act="freshStart" data-places data-t="btn.freshStart" hidden></button><button class="btn" data-look="soft" data-act="copyDetails" data-t="btn.copyDetails"></button><button class="btn" data-look="soft" data-act="saveLog" data-t="btn.saveLog"></button><button class="btn disclose" data-look="link" data-act="toggleDetails" aria-expanded="false"><span data-t="btn.details"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.2 8 9.7l3.5-3.5"/></svg></button></div><div class="log" hidden><pre></pre></div></div></section>
<section class="card" data-kind="viewFailed" hidden><div class="card-scroll"><p class="lead" data-t="card.viewFailed.lead"></p><p class="small do" data-t="card.viewFailed.do"></p><div class="card-actions"><button class="btn" data-look="primary" data-act="reloadView" data-t="btn.reload"></button><button class="btn" data-look="soft" data-act="copyDetails" data-t="btn.copyDetails"></button><button class="btn" data-look="soft" data-act="saveLog" data-t="btn.saveLog"></button><button class="btn disclose" data-look="link" data-act="toggleDetails" aria-expanded="false"><span data-t="btn.details"></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 6.2 8 9.7l3.5-3.5"/></svg></button></div><div class="log" hidden><pre></pre></div></div></section>
</div>
</section>
</main>
<div class="flight" aria-hidden="true"></div>
<footer class="footrow"><p class="place" hidden><span class="place-text"></span><button class="btn" data-look="small" data-act="pick" data-detail="changePlace" data-t="btn.changePlace"></button></p></footer>
<p class="sr live" aria-live="polite"></p>
</body>
</html>
