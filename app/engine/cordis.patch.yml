# The engine layer of the desktop app's profile, over dsh-base and under
# ds-bot. It adds the loopback transport for ds-bot's channel, the host
# services ds-bot uses, the static dist server for DS Bot's own frontend
# (../ui/dist), and the agent preset that Bot Sessions run on. It has no DSH
# Web front-end rows: the window talks only to ds-bot's channel.
#
# The host rows follow @deepseek-ai/dsh-web-app's bundle patch (MIT; see NOTICE).
# When the app moves to another DSH version, compare this file and
# preset-standard.patch.yml with that version's dsh-web-app bundle patch and
# standard preset.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# Full-text session search stays opt-in to keep startup quiet.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- insert:
    # Loopback HTTP transport for the desktop window and ds-bot's /api/bot
    # channel. Binds the sticky port chosen by the Electron shell (DS_BOT_PORT)
    # or an OS-assigned port when unset.
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: !!js "Number(process.env.DS_BOT_PORT) || 0"
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []

    # This package's own plugin (index.js): launch-token exchange and static
    # asset server for DS Bot's built frontend (app/ui/dist).
    - id: engine-index
      name: dsbot-engine

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    # Uploads staged for later prompts; the session controller needs it.
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: workspace-changes
      name: '@deepseek-ai/dsh-workspace-changes'

    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # Host-only Cordis runtime & inspect providers for the cordis preset (Creator Mode).
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    # Session projections read by DS Bot's own UI and sidebar.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: deliverable-file-references
      name: '@deepseek-ai/dsh-deliverable-file-references'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: office-kit
      name: '@deepseek-ai/dsh-office-kit'
      config:
        outputDirectory: !!js dshHomePath('office-kit', 'outputs')

    - id: mcp-manager
      name: '@deepseek-ai/dsh-mcp-manager'
      inject: [credentials]

    # Host-owned authorization sampled at Agent creation.
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

# Every Session mounts an agent preset, so the base rows that compose one
# agent's tools and prompt sections are off on the host plane. The registries
# they feed (jobs, skills, goals, subagents, the token meter) stay on.

- id: tool-plugin-manager
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard
